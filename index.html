<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>NEON CHAT</title>
<style>
:root{--grad-1:#ff00cc;--grad-2:#3333ff;--grad-3:#00d4ff;--panel-bg:rgba(10,10,25,.9);--neon-border:rgba(255,255,255,.1);--neon-green:#00ffcc}
*{box-sizing:border-box}
body{margin:0;font-family:'Segoe UI',Roboto,sans-serif;height:100vh;height:100dvh;display:flex;flex-direction:column;overflow:hidden;color:#fff;
background:linear-gradient(-45deg,#050505,#1a1a2e,#16213e,#0f3460);background-size:400% 400%;animation:bg 15s ease infinite}
@keyframes bg{0%,100%{background-position:0% 50%}50%{background-position:100% 50%}}
button{position:relative;background:rgba(255,255,255,.05);color:#fff;border:2px solid var(--neon-green);padding:10px 20px;border-radius:12px;font-weight:800;cursor:pointer;overflow:hidden;transition:all .3s;text-transform:uppercase;font-size:11px;letter-spacing:1px;display:flex;align-items:center;justify-content:center}
button::before{content:'';position:absolute;top:0;left:-100%;width:100%;height:100%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.4),transparent);transition:.5s}
button:hover::before{left:100%}
button:hover{transform:translateY(-3px);background:var(--neon-green);color:#000;box-shadow:0 0 30px rgba(0,255,204,.5)}
.btn-clear{border-color:#ff4b2b;color:#ff4b2b}.btn-clear:hover{background:#ff4b2b;color:#fff;box-shadow:0 0 30px rgba(255,75,43,.5)}
.btn-back{border-color:var(--grad-3);color:var(--grad-3)}.btn-back:hover{background:var(--grad-3);color:#000;box-shadow:0 0 30px rgba(0,212,255,.5)}
.logo{font-size:1.4rem;font-weight:900;background:linear-gradient(to right,var(--grad-1),var(--grad-3));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
input{background:rgba(255,255,255,.05);color:var(--neon-green);border:2px solid var(--neon-border);border-radius:12px;padding:12px 16px;font-size:15px;outline:none;font-family:inherit;width:100%}
input:focus{border-color:var(--neon-green)}
/* login */
#login{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;align-items:center;z-index:100;background:rgba(5,5,5,.85);backdrop-filter:blur(25px);gap:16px;padding:20px}
.studio-title{font-size:clamp(2.5rem,8vw,4.5rem);font-weight:900;margin:0 0 20px;background:linear-gradient(to right,var(--grad-1),var(--grad-3));-webkit-background-clip:text;-webkit-text-fill-color:transparent;filter:drop-shadow(0 0 20px rgba(255,0,204,.5));letter-spacing:-2px}
#login form{width:min(360px,100%);padding:40px 32px;background:var(--panel-bg);border:1px solid var(--neon-border);border-radius:30px;display:flex;flex-direction:column;gap:14px}
#login form:focus-within{border-color:var(--grad-1);box-shadow:0 0 60px rgba(255,0,204,.2)}
#err{color:#ff5555;font-size:13px;min-height:16px;text-align:center}
/* app */
#app{display:none;flex:1;flex-direction:column;min-height:0}
header{padding:12px 24px;background:rgba(0,0,0,.7);backdrop-filter:blur(15px);border-bottom:2px solid var(--neon-border);display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px}
.tool-bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
#whoami{color:#888;font-size:12px;font-weight:800}
.container{display:grid;grid-template-columns:minmax(220px,300px) 1fr;flex:1;gap:20px;padding:20px;min-height:0;width:100%;max-width:1500px;margin:0 auto}
.panel{background:var(--panel-bg);border-radius:24px;border:1px solid var(--neon-border);display:flex;flex-direction:column;overflow:hidden;min-height:0}
.panel-header{padding:12px 22px;background:rgba(255,255,255,.03);display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--neon-border);font-size:11px;font-weight:800;color:#888;text-transform:uppercase;gap:8px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--grad-1);box-shadow:0 0 8px var(--grad-1)}
#members{overflow-y:auto;padding:10px;display:flex;flex-direction:column;gap:8px}
.mem{padding:12px 16px;border-radius:14px;border:1px solid var(--neon-border);cursor:pointer;display:flex;justify-content:space-between;align-items:center;transition:.25s;font-weight:700;font-size:14px}
.mem:hover{border-color:var(--grad-3);transform:translateX(4px)}
.mem.active{border-color:var(--grad-1);box-shadow:0 0 20px rgba(255,0,204,.25);background:rgba(255,0,204,.08)}
.mem small{color:#888;font-weight:600}
.kick{padding:4px 8px;font-size:10px;border-color:#ff4b2b;color:#ff4b2b}
#msgs{flex:1;overflow-y:auto;padding:20px;display:flex;flex-direction:column;gap:10px}
.msg{max-width:75%;padding:10px 14px;border-radius:16px;background:rgba(255,255,255,.06);border:1px solid var(--neon-border);align-self:flex-start;word-wrap:break-word;position:relative}
.msg.mine{align-self:flex-end;background:rgba(0,255,204,.08);border-color:rgba(0,255,204,.35)}
.msg b{font-size:12px;color:var(--grad-3);cursor:pointer;display:inline-block;margin-right:8px}
.msg.mine b{color:var(--neon-green);cursor:default}
.msg time{font-size:10px;color:#777}
.msg .txt{margin-top:3px;font-size:15px;line-height:1.45;white-space:pre-wrap}
.mention{color:var(--grad-1);font-weight:800}.mention.me{background:rgba(255,0,204,.2);border-radius:6px;padding:0 4px}
.del{position:absolute;top:6px;right:6px;padding:0 7px;font-size:11px;border-width:1px;border-color:#ff4b2b;color:#ff4b2b;border-radius:8px}
#sendbar{display:flex;gap:10px;padding:14px;border-top:1px solid var(--neon-border)}
.msg time{margin-right:2px}.edited{color:#777;font-size:10px}
.quote{margin:5px 0 2px;padding:5px 8px;border-left:3px solid var(--grad-1);background:rgba(255,255,255,.06);border-radius:6px;font-size:12px;cursor:pointer;color:#bbb;overflow:hidden}
.quote span:first-child{color:var(--grad-1);font-weight:800;margin-right:6px}
.tick{text-align:right;font-size:11px;color:#777;margin-top:2px;user-select:none}.tick.seen{color:var(--neon-green);text-shadow:0 0 6px rgba(0,255,204,.6)}
.acts{display:none;gap:6px;margin-top:4px}.msg.open .acts{display:flex}
@media(hover:hover){.msg:hover .acts{display:flex}}
.acts button{padding:1px 9px;font-size:14px;border-width:1px;border-radius:8px;text-transform:none;letter-spacing:0}
.acts button:hover{transform:none;box-shadow:none}
.msg.flash{animation:flash 1.2s}@keyframes flash{0%,60%{box-shadow:0 0 0 2px var(--grad-1),0 0 20px var(--grad-1)}100%{box-shadow:none}}
#replyBar{display:none;align-items:center;gap:10px;padding:8px 14px;border-top:1px solid var(--neon-border);background:rgba(255,0,204,.07);font-size:12px;color:#ccc}
#replyTxt{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#replyX{padding:2px 9px;font-size:12px;border-color:#ff4b2b;color:#ff4b2b}
.pdot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#00e676;box-shadow:0 0 8px #00e676;margin-right:7px}
#chatSub{text-transform:none;font-weight:700;margin-left:8px;color:#888}#chatSub.on{color:#00e676}
#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#0a0a19;border:2px solid var(--neon-green);padding:12px 22px;border-radius:14px;font-weight:700;display:none;z-index:200;box-shadow:0 0 30px rgba(0,255,204,.4)}
#callUI{position:fixed;inset:0;z-index:150;display:none;flex-direction:column;align-items:center;justify-content:center;gap:16px;background:rgba(5,5,16,.97);backdrop-filter:blur(20px);padding:20px;text-align:center}
#callAvatar{width:120px;height:120px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:3rem;font-weight:900;background:linear-gradient(135deg,var(--grad-1),var(--grad-3));animation:ringPulse 1.6s infinite}
@keyframes ringPulse{0%{box-shadow:0 0 0 0 rgba(255,0,204,.55)}100%{box-shadow:0 0 0 48px rgba(255,0,204,0)}}
#callName{font-size:1.8rem;font-weight:900}#callStatus{color:#888;font-weight:700;letter-spacing:1px;min-height:18px}
.call-btns{display:flex;gap:14px;margin-top:22px}
@media(prefers-reduced-motion:reduce){#callAvatar{animation:none}}
select{background:rgba(255,255,255,.05);color:var(--neon-green);border:2px solid var(--neon-border);border-radius:12px;padding:10px 12px;font:inherit;font-size:14px;outline:none;max-width:100%}
select:focus{border-color:var(--neon-green)}option{background:#0a0a19;color:#fff}
#typingBar{display:none;padding:2px 18px 6px;font-size:12px;color:var(--grad-3);font-weight:700;font-style:italic}
.badge{background:var(--grad-1);color:#fff;border-radius:11px;padding:1px 8px;font-size:11px;font-weight:900;margin-left:8px;box-shadow:0 0 10px rgba(255,0,204,.6)}
#adminBar{display:none;gap:10px;padding:8px 24px;background:rgba(255,0,100,.06);border-bottom:1px solid var(--neon-border);flex-wrap:wrap}
#annBar{display:none;padding:9px 18px;background:rgba(255,200,0,.1);border-bottom:1px solid rgba(255,200,0,.35);color:#ffd54a;font-size:13px;font-weight:700;word-break:break-word}
#pinBar{display:none;align-items:center;gap:10px;padding:8px 18px;background:rgba(0,212,255,.07);border-bottom:1px solid var(--neon-border);font-size:12px;color:#cfefff}
#pinTxt{flex:1;cursor:pointer;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#unpinBtn{padding:1px 8px;font-size:11px;border-width:1px;border-color:#ff4b2b;color:#ff4b2b}
.acts{flex-wrap:wrap;align-items:center}.picker{display:flex;gap:2px;margin-right:6px}
.acts .picker button{border:none;background:none;padding:1px 4px;font-size:17px}
.rxrow{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}
.rx{padding:1px 9px;font-size:12px;border-width:1px;border-radius:14px;text-transform:none;letter-spacing:0;border-color:var(--neon-border)}
.rx.me{border-color:var(--grad-1);background:rgba(255,0,204,.16)}.rx:hover{transform:none;box-shadow:none}
#modal{display:none;position:fixed;inset:0;z-index:180;background:rgba(0,0,0,.72);backdrop-filter:blur(6px);align-items:center;justify-content:center;padding:16px}
#modal .card{width:min(580px,100%);max-height:90vh;max-height:90dvh;overflow:auto;background:#0b0b1c;border:1px solid var(--neon-border);border-radius:22px;padding:18px 20px;box-shadow:0 0 60px rgba(255,0,204,.18)}
.mh{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;font-size:16px;font-weight:900}
.mh button{padding:2px 10px;font-size:12px}
.sec{padding:12px 0;border-bottom:1px solid var(--neon-border)}.sec:last-child{border:none}
.sec h4{margin:0 0 8px;color:var(--grad-3);font-size:11px;text-transform:uppercase;letter-spacing:1px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.row input{flex:1;min-width:140px}
.hint{color:#888;font-size:12px;margin:6px 0 0}
.hrow,.arow{padding:8px 0;border-bottom:1px solid var(--neon-border);font-size:13px;color:#ddd;word-break:break-word}
.hrow b,.arow b{display:block;font-size:11px;color:var(--grad-3)}
.tbl-wrap{overflow-x:auto}.tbl{width:100%;border-collapse:collapse;font-size:13px;white-space:nowrap}
.tbl th,.tbl td{text-align:left;padding:8px 8px;border-bottom:1px solid var(--neon-border)}.tbl th{color:#888;font-size:11px;text-transform:uppercase}
@media(min-width:1200px){.container{padding:24px;gap:24px}.msg{max-width:62%}#msgs{padding:24px 28px}}
@media(max-width:1000px) and (min-width:761px){.container{grid-template-columns:210px 1fr;gap:14px;padding:14px}}
@media(max-width:760px){
  header{padding:8px 12px;padding-top:calc(8px + env(safe-area-inset-top))}
  .logo{font-size:1.1rem}
  .tool-bar{width:100%;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none}.tool-bar>*{flex:0 0 auto}
  #adminBar{padding:6px 12px;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none}#adminBar>*{flex:0 0 auto}
  .container{grid-template-columns:1fr;grid-template-rows:auto minmax(0,1fr);padding:8px;gap:8px}
  .container>.panel:first-child .panel-header{display:none}
  #members{flex-direction:row;overflow-x:auto;overflow-y:hidden;padding:8px;gap:8px}
  .mem{flex:0 0 auto;padding:8px 12px;white-space:nowrap;font-size:13px}.mem small{display:none}.mem:hover{transform:none}
  .panel{border-radius:18px}.msg{max-width:90%}#msgs{padding:12px}
  #sendbar{padding:10px;padding-bottom:calc(10px + env(safe-area-inset-bottom))}
  input,select{font-size:16px}
  .acts button{min-height:34px;min-width:34px}.acts .picker button{font-size:20px}
  #modal{align-items:flex-end;padding:0}#modal .card{border-radius:22px 22px 0 0;max-height:88vh;max-height:88dvh;padding-bottom:calc(18px + env(safe-area-inset-bottom))}
  #toast{width:calc(100% - 24px);bottom:90px;text-align:center}
}
</style>
</head>
<body>

<div id="login">
  <h1 class="studio-title">NEON CHAT</h1>
  <form id="loginForm">
    <input id="u" placeholder="Username" autocomplete="username" required>
    <input id="p" type="password" placeholder="Password" autocomplete="current-password" required>
    <button type="submit">Log in</button>
    <div id="err"></div>
  </form>
</div>

<div id="app">
  <header>
    <div class="logo">NEON // CHAT</div>
    <div class="tool-bar">
      <span id="whoami"></span>
      <button id="adminToggle" class="btn-back" style="display:none"></button>
      <button id="notifBtn" class="btn-back">Enable notifications</button>
      <button class="btn-clear" id="outBtn">Log out</button>
    </div>
  </header>
  <div id="adminBar" class="admin-only">
    <button class="btn-clear" id="clearBtn">Clear history</button>
    <button class="btn-clear" id="kickAllBtn">Log out others</button>
    <button class="btn-back" id="monBtn">Monitor DM</button>
    <button class="btn-back" id="actBtn">Activity</button>
    <button class="btn-back" id="auditBtn">Audit log</button>
  </div>
  <div class="container">
    <div class="panel">
      <div class="panel-header">Members <div class="dot"></div></div>
      <div id="members"></div>
    </div>
    <div class="panel">
      <div class="panel-header"><span><span id="chatTitle">Group chat</span><small id="chatSub"></small></span><span style="display:flex;gap:10px;align-items:center"><button id="toolsBtn" class="btn-back admin-only" style="display:none;padding:5px 12px">🛠 Tools</button><button id="callBtn" style="display:none;padding:5px 12px">📞 Call</button><div class="dot" style="background:var(--grad-3);box-shadow:0 0 8px var(--grad-3)"></div></span></div>
      <div id="annBar"></div>
      <div id="pinBar"><span id="pinTxt"></span><button id="unpinBtn">✕</button></div>
      <div id="msgs"></div>
      <div id="typingBar"></div>
      <div id="replyBar"><span id="replyTxt"></span><button id="replyX">✕</button></div>
      <div id="sendbar">
        <input id="msgIn" placeholder="Message… use @username to notify someone" autocomplete="off">
        <button id="sendBtn">Send</button>
      </div>
    </div>
  </div>
</div>
<div id="callUI">
  <div id="callAvatar"></div><div id="callName"></div><div id="callStatus"></div>
  <audio id="remoteA" autoplay></audio>
  <div class="call-btns">
    <button id="acceptBtn" style="display:none">Accept</button>
    <button id="muteBtn" class="btn-back">Mute</button>
    <button id="hangBtn" class="btn-clear">Hang up</button>
  </div>
</div>
<div id="modal"><div class="card"><div class="mh"><span id="mTitle"></span><button id="mX" class="btn-clear">✕</button></div><div id="mBody"></div></div></div>
<div id="toast"></div>

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {getAuth,signInWithEmailAndPassword,signOut,onAuthStateChanged,setPersistence,browserLocalPersistence} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {getFirestore,collection,doc,setDoc,addDoc,deleteDoc,onSnapshot,query,orderBy,limit,serverTimestamp,getDocs,writeBatch,arrayUnion,arrayRemove,where,updateDoc,deleteField,getDoc,getCountFromServer} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import {getMessaging,getToken,onMessage} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-messaging.js";

/* ============ EDIT THIS SECTION ============ */
// Firebase web config. This is NOT a secret (see README) - your security comes from firestore.rules + disabled sign-up.
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyC7tylN7VmPo5MntIwsoNQw5NhmGf-SasE",
  authDomain: "chat-68d6a.firebaseapp.com",
  projectId: "chat-68d6a",
  storageBucket: "chat-68d6a.firebasestorage.app",
  messagingSenderId: "828067301108",
  appId: "1:828067301108:web:242921194c21f6ffdc00a1"
};
// Firebase > Project settings > Cloud Messaging > Web Push certificates (public key, safe to expose)
const VAPID_KEY = "BNyJudC9tMNoyo0xoGQPI4bImHK7qvAHuYdY9PYaA4JzTJpno6evLwp9Grgjq4Cpo-LBB6Z_rzI1nUTFWvmXTAs";

// OPTIONAL real background push (free, via Cloudflare Worker - see cloudflare-worker.js). Leave "" to use in-app alerts only.
const WORKER_URL = "https://autumn-mountain-8f2c.skydive462462.workers.dev";

// Typing just "rainbow" at login signs in as rainbow@EMAIL_DOMAIN
const EMAIL_DOMAIN = "chat.local";
// Users whose Firebase email is NOT on EMAIL_DOMAIN: username -> full email (username = part before the @)
const EMAILS = { admin: "admin@sky.com" };
// FULL email of the admin account in Firebase Auth. Must also be set in firestore.rules
const ADMIN_EMAIL = "admin@sky.com";

// username (part of the email before @) -> display name shown in chat. Also seeds the members list.
const NAMES = {
  admin: "SKY",
  rainbow: "rainbow",
  daksh: "light"
};
/* ============================================ */

const app = initializeApp(FIREBASE_CONFIG), auth = getAuth(app), db = getFirestore(app);
// Stay logged in (even after closing the browser) until the user presses Log out
setPersistence(auth, browserLocalPersistence).catch(() => {});
const $ = id => document.getElementById(id);
const nm = u => NAMES[u] || u;
const esc = s => s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let me = '', isAdmin = false, chat = {kind:'group', id:'', label:'Group chat'}, profiles = [], unsubs = [], unsubChat = null;
const dmWatch = new Map();
let typingData = {}, unsubTyping = null, lastTypingWrite = 0, unread = {}, lastReadOf = {}, settings = {}, unsubSet = null, modalKind = '', adminOn = true, lastDocs = [], readsData = {}, unsubReads = null, replyTo = null, editing = null, openMsg = null, justOpened = true, readTimer = 0, hbT = null, presence = {};
const EDIT_MS = 15 * 60 * 1000;
const unreadWatch = new Map();

function toast(t){const e=$('toast');e.textContent=t;e.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>e.style.display='none',3500)}

/* ---------- login ---------- */
$('loginForm').onsubmit = async e => {
  e.preventDefault(); $('err').textContent = '';
  const u = $('u').value.trim().toLowerCase();
  try { await signInWithEmailAndPassword(auth, EMAILS[u] || (u.includes('@') ? u : `${u}@${EMAIL_DOMAIN}`), $('p').value); }
  catch { $('err').textContent = 'Wrong username or password.'; }
};
$('outBtn').onclick = logout;
// Log out = remove THIS device's notification token from the account, then sign out
async function logout(){
  if (callRef) endCall(true, false);
  try { const t = localStorage.getItem('fcmToken'); if (t && me) await setDoc(doc(db,'tokens',me), {tokens:arrayRemove(t)}, {merge:true}); } catch {}
  try { if (me) await setDoc(doc(db,'presence',me), {online:false, t:serverTimestamp()}); } catch {}
  localStorage.removeItem('fcmToken'); signOut(auth);
}

onAuthStateChanged(auth, async user => {
  if (callRef || pc) endCall(true, false);
  unsubs.forEach(f => f()); unsubs = []; if (unsubChat) unsubChat();
  dmWatch.forEach(f => f()); dmWatch.clear();
  if (unsubReads) { unsubReads(); unsubReads = null; } if (unsubSet) { unsubSet(); unsubSet = null; } if (unsubTyping) { unsubTyping(); unsubTyping = null; }
  unreadWatch.forEach(f => f()); unreadWatch.clear(); unread = {}; lastReadOf = {}; typingData = {}; clearInterval(hbT); presence = {};
  if (!user) { $('app').style.display = 'none'; $('login').style.display = 'flex'; return; }
  me = user.email.split('@')[0].toLowerCase();
  isAdmin = user.email.toLowerCase() === ADMIN_EMAIL;
  $('login').style.display = 'none'; $('app').style.display = 'flex'; $('p').value = '';
  adminOn = isAdmin && localStorage.getItem('adminOn') !== '0'; applyAdminUI();
  await setDoc(doc(db,'users',me), {name:nm(me), email:user.email}, {merge:true});
  beat(true); hbT = setInterval(() => { if (!document.hidden) beat(true); }, 60000);
  unsubs.push(onSnapshot(collection(db,'presence'), s => {
    presence = {}; s.forEach(d => { const v = d.data(); presence[d.id] = {online:!!v.online, t: v.t && v.t.toMillis ? v.t.toMillis() : Date.now()}; });
    updateHeader(); drawMembers();
  }, () => {}));
  unsubs.push(onSnapshot(collection(db,'users'), s => { profiles = s.docs.map(d => d.id); drawMembers(); }));
  let first = true;   // remote log-out: reacts only to changes made after we logged in
  unsubs.push(onSnapshot(doc(db,'control','logout'), s => {
    if (first) { first = false; return; }
    const d = s.data(); if (!d || isAdmin) return;
    if (d.target === 'all' || d.target === me) { toast('You were logged out by admin'); logout(); }
  }));
  // private warning pop-up from admin
  unsubs.push(onSnapshot(doc(db,'warn',me), s => {
    const d = s.data(); if (!d) return; const k = 'warnSeen_' + me;

  }, () => {}));
  // in-app alerts: @mentions in the group chat

  unsubs.push(onSnapshot(query(collection(db,'group'), orderBy('ts','desc'), limit(1)), s => {
    if (gFirst) { gFirst = false; return; }

/* ---------- members ---------- */
function drawMembers(){

  const box = $('members'); box.innerHTML = '';

/* ---------- in-app alerts (free, work while the site is open) ---------- */

}
function alertUser(title, body, kind, id){

}
async function pingWorker(c, text){

}

/* ---------- chat ---------- */
const colRef = () => chat.kind==='group' ? collection(db,'group') : collection(db,'dms',chat.id,'messages');
const canSendIn = (k, id) => k === 'group' || id.split('__').includes(me);
const readId = () => chat.kind === 'group' ? 'group' : chat.id;
const tms = v => v && v.toMillis ? v.toMillis() : 0;
const ago = t => { const m = Math.floor((Date.now() - t) / 60000); if (m < 1) return 'just now'; if (m < 60) return m + ' min ago';
  const h = Math.floor(m / 60); return h < 24 ? h + ' h ago' : new Date(t).toLocaleDateString(); };

/* presence */
const isOnline = u => { const p = presence[u]; return !!(p && p.online && Date.now() - p.t < 90000); };
function beat(on){ if (!me || !auth.currentUser) return; setDoc(doc(db,'presence',me), {online:on, t:serverTimestamp()}).catch(() => {}); }
function updateHeader(){
  const s = $('chatSub'); s.textContent = ''; s.className = '';

  const peer = chat.id.split('__').find(x => x !== me), p = presence[peer];

}
document.addEventListener('visibilitychange', () => { if (!me || !auth.currentUser) return; if (document.hidden) beat(false); else { beat(true); markRead(); touchSeen(); } });
addEventListener('pagehide', () => beat(false));
setInterval(() => { if (me && auth.currentUser) { updateHeader(); drawMembers(); } }, 30000);

/* reply / edit bar */
function setBar(){

$('replyX').onclick = () => { if (editing) $('msgIn').value = ''; clearCompose(); };
function startReply(id, m){ editing = null; replyTo = {id, name: m.name || m.from, text: String(m.text || '').slice(0, 80)}; setBar(); $('msgIn').focus(); }
function startEdit(d, m){ replyTo = null; editing = {ref: d.ref, old: m.text}; $('msgIn').value = m.text; setBar(); $('msgIn').focus(); }
function jumpTo(id){

/* seen */
function markRead(){
  if (adm() || document.hidden || !auth.currentUser || !canSendIn(chat.kind, chat.id) || !lastDocs.length) return;   // admin mode ON = invisible, reads nothing
  const newest = Math.max(0, ...lastDocs.map(d => d.data()).filter(m => m.from !== me).map(m => tms(m.ts)));
  if (!newest || newest <= tms(readsData[me])) return;
  if (Date.now() - readTimer < 3000) { clearTimeout(markRead.t); markRead.t = setTimeout(markRead, 3000); return; }
  readTimer = Date.now();
  setDoc(doc(db,'reads',readId()), {[me]: serverTimestamp()}, {merge:true}).catch(() => {});
}
function tickEl(m){
  const s = document.createElement('div'); s.className = 'tick'; const ts = tms(m.ts);
  if (!m.ts) { s.textContent = '🕒'; return s; }                       // not on the server yet
  if (chat.kind === 'dm') {
    const peer = chat.id.split('__').find(x => x !== me), seen = tms(readsData[peer]) >= ts;
    s.textContent = seen ? '✓✓' : '✓'; if (seen) s.classList.add('seen');
  } else {
    const names = Object.keys(readsData).filter(u => u !== me && tms(readsData[u]) >= ts);
    if (!names.length) s.textContent = '✓';
    else { s.textContent = '👁 ' + names.length; s.classList.add('seen'); s.style.cursor = 'pointer';
      s.onclick = ev => { ev.stopPropagation(); toast('Seen by: ' + names.map(nm).join(', ')); }; }
  }
  return s;
}

/* tiny DOM helper */
const h = (tag, a = {}, ...kids) => { const e = document.createElement(tag);
  for (const [k, v] of Object.entries(a)) { if (k === 'class') e.className = v; else if (k === 'text') e.textContent = v; else if (k.startsWith('on')) e[k] = v; else e.setAttribute(k, v); }
  kids.flat().forEach(c => e.append(c)); return e; };

/* unread badges: count of other people's messages newer than my last-read time */
const seenAt = k => adm() ? (+localStorage.getItem('seen_' + me + '_' + k) || 0) : (lastReadOf[k] || 0);   // admin ON reads nothing on the server, so it uses a local marker
const isOpenNow = k => k === readId() && !document.hidden && canSendIn(chat.kind, chat.id);
function updateTitle(){
  const n = Object.values(unread).reduce((a, b) => a + b, 0);
  if (!titleT) document.title = (n ? '(' + n + ') ' : '') + 'NEON CHAT';
  try { if (n) navigator.setAppBadge && navigator.setAppBadge(n); else navigator.clearAppBadge && navigator.clearAppBadge(); } catch {}
}
function bump(k){ if (isOpenNow(k)) return; unread[k] = (unread[k] || 0) + 1; drawMembers(); updateTitle(); }
function touchSeen(){
  if (document.hidden || !me || !canSendIn(chat.kind, chat.id)) return;
  const k = readId(); if (adm()) localStorage.setItem('seen_' + me + '_' + k, Date.now());
  if (unread[k]) { unread[k] = 0; drawMembers(); updateTitle(); }
}
async function refreshUnread(k){
  if (isOpenNow(k)) { if (unread[k]) { unread[k] = 0; drawMembers(); updateTitle(); } return; }
  try {
    const col = k === 'group' ? collection(db,'group') : collection(db,'dms',k,'messages');
    const s = await getDocs(query(col, where('ts','>', new Date(seenAt(k))), orderBy('ts','asc'), limit(100)));
    unread[k] = s.docs.filter(d => d.data().from !== me).length;
  } catch { return; }
  drawMembers(); updateTitle();
}
function watchUnread(list){
  ['group', ...list.map(u => [me, u].sort().join('__'))].forEach(k => {
    if (unreadWatch.has(k)) return;

  });
}

/* typing indicator: a tiny typing/{chat} doc, one timestamp per person, written at most every 2.5 s */
function updateTyping(){
  const bar = $('typingBar'), now = Date.now();
  const lastFrom = u => { for (let i = lastDocs.length - 1; i >= 0; i--) { const m = lastDocs[i].data(); if (m.from === u) return tms(m.ts); } return 0; };
  const names = Object.entries(typingData).filter(([u, t]) => u !== me && t && t.toMillis && now - t.toMillis() < 5000 && lastFrom(u) < t.toMillis()).map(([u]) => nm(u));
  bar.style.display = names.length ? 'block' : 'none';
  bar.textContent = names.length ? names.join(', ') + (names.length > 1 ? ' are typing…' : ' is typing…') : '';
}
$('msgIn').addEventListener('input', () => {
  if (adm() || editing || !$('msgIn').value || !canSendIn(chat.kind, chat.id) || Date.now() - lastTypingWrite < 2500) return;   // admin ON stays invisible

/* reactions */
const RX = [['up','👍'],['heart','❤️'],['lol','😂'],['wow','😮'],['sad','😢'],['fire','🔥']];
function react(d, m, key){
  const has = ((m.reactions || {})[key] || []).includes(me);
  updateDoc(d.ref, {['reactions.' + key]: has ? arrayRemove(me) : arrayUnion(me)}).catch(e => toast('Reaction failed: ' + e.code));
}

/* composer: lock / mute / slow mode (admin ON is never blocked) */
const PH = 'Message… use @username to notify someone';
function composerState(){
  if (!canSendIn(chat.kind, chat.id)) return {ok:false, msg:'Read-only (admin monitor)'};
  if (adm()) return {ok:true};
  if (settings.locked) return {ok:false, msg:'🔒 Chat is locked by admin'};
  const mu = tms((settings.mutes || {})[me]);
  if (mu > Date.now()) return {ok:false, msg:'🔇 You are muted until ' + new Date(mu).toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'})};
  const n = settings.slow | 0;
  if (n > 0) {
    let last = 0;
    for (let i = lastDocs.length - 1; i >= 0; i--) { const m = lastDocs[i].data(); if (m.from === me) { last = m.ts ? tms(m.ts) : Date.now(); break; } }
    const wait = Math.ceil((last + n * 1000 - Date.now()) / 1000);
    if (last && wait > 0) return {ok:true, soft:true, wait, msg:'Slow mode: wait ' + wait + 's'};
  }
  return {ok:true};
}
function updateComposer(){
  const c = composerState(), inp = $('msgIn'), btn = $('sendBtn');
  inp.disabled = !c.ok; btn.disabled = !c.ok || !!c.soft;
  inp.placeholder = c.ok ? PH : c.msg; btn.textContent = c.soft ? c.wait + 's' : 'Send';
}
setInterval(() => { if (me && auth.currentUser) { updateComposer(); updateTyping(); } }, 1000);
function applyChatState(){
  const a = $('annBar'), p = $('pinBar');
  if (settings.announce && settings.announce.text) { a.style.display = 'block'; a.textContent = '📢 ' + settings.announce.text; } else a.style.display = 'none';
  if (settings.pin) { p.style.display = 'flex'; $('pinTxt').textContent = '📌 ' + settings.pin.name + ': ' + settings.pin.text; $('unpinBtn').style.display = adm() ? 'flex' : 'none'; }
  else p.style.display = 'none';
  updateComposer();
}
$('pinTxt').onclick = () => settings.pin && jumpTo(settings.pin.id);
$('unpinBtn').onclick = () => setSet({pin: deleteField()}, 'unpin', '');

function render(){
  const box = $('msgs'), top = box.scrollTop, near = box.scrollHeight - top - box.clientHeight < 80, part = canSendIn(chat.kind, chat.id);
  box.innerHTML = '';
  lastDocs.forEach(d => {
    const m = d.data(), mine = m.from === me, el = document.createElement('div');
    el.className = 'msg' + (mine ? ' mine' : '') + (openMsg === d.id ? ' open' : ''); el.dataset.id = d.id;
    const who = document.createElement('b'); who.textContent = m.name || m.from;
    who.onclick = ev => { if (chat.kind==='group' && m.from!==me) { ev.stopPropagation(); $('msgIn').value += '@'+m.from+' '; $('msgIn').focus(); } };
    const t = document.createElement('time'); t.textContent = m.ts ? m.ts.toDate().toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'}) : '…';
    el.append(who, t);
    if (m.edited) { const e = document.createElement('small'); e.className = 'edited'; e.textContent = ' (edited)'; el.append(e); }
    if (m.reply) {
      const q = document.createElement('div'); q.className = 'quote';
      const qn = document.createElement('span'), qt = document.createElement('span'); qn.textContent = m.reply.name; qt.textContent = m.reply.text;
      q.append(qn, qt); q.onclick = ev => { ev.stopPropagation(); jumpTo(m.reply.id); }; el.append(q);
    }
    const tx = document.createElement('div'); tx.className = 'txt';
    tx.innerHTML = esc(m.text).replace(/@(\w+)/g, (_,n) => `<span class="mention${n.toLowerCase()===me?' me':''}">@${n}</span>`);
    el.append(tx);
    const rxs = RX.filter(([k]) => ((m.reactions || {})[k] || []).length);
    if (rxs.length) {
      const row = h('div', {class:'rxrow'});
      rxs.forEach(([k, e]) => { const l = m.reactions[k], on = l.includes(me);
        const c = h('button', {class:'rx' + (on ? ' me' : ''), title:l.map(nm).join(', '), text:e + ' ' + l.length});
        c.onclick = ev => { ev.stopPropagation(); if (part) react(d, m, k); else toast(l.map(nm).join(', ')); };
        row.append(c); });
      el.append(row);
    }
    if (mine) el.append(tickEl(m));
    const a = h('div', {class:'acts'});
    const mk = (ic, title, fn) => { const bt = h('button', {text:ic, title}); bt.onclick = ev => { ev.stopPropagation(); fn(); }; return bt; };
    if (part) {
      const pk = h('span', {class:'picker'}); RX.forEach(([k, e]) => pk.append(mk(e, 'React', () => react(d, m, k)))); a.append(pk);
      a.append(mk('↩', 'Reply', () => startReply(d.id, m)));
      if (mine && !String(m.text).startsWith('📞') && (adm() || (m.ts && Date.now() - tms(m.ts) < EDIT_MS))) a.append(mk('✏', 'Edit', () => startEdit(d, m)));
    }
    if (adm()) {
      a.append(mk('📌', 'Pin message', () => setSet({pin:{id:d.id, name:m.name || m.from, text:String(m.text).slice(0, 100)}}, 'pin', nm(m.from) + ': ' + String(m.text).slice(0, 60))));
      if (m.history && m.history.length) a.append(mk('🕘', 'Edit history', () => showHistory(m)));
    }

    el.onclick = () => { openMsg = openMsg === d.id ? null : d.id; box.querySelectorAll('.msg').forEach(x => x.classList.toggle('open', x.dataset.id === openMsg)); };
    if (adm()) { const x = document.createElement('button'); x.className='del'; x.textContent='✕';
      x.onclick = ev => { ev.stopPropagation(); deleteDoc(d.ref); logAudit('delete-message', nm(m.from) + ': ' + String(m.text).slice(0, 60)); }; el.append(x); }
    box.append(el);
  });
  if (justOpened || near) { box.scrollTop = box.scrollHeight; if (lastDocs.length) justOpened = false; } else box.scrollTop = top;
  updateComposer(); updateTyping(); touchSeen();
}

function openChat(kind, id, label){
  chat = {kind, id, label}; $('chatTitle').textContent = label; drawMembers();
  const canSend = canSendIn(kind, id);
  $('callBtn').style.display = (kind === 'dm' && id.split('__').includes(me)) ? 'flex' : 'none';
  if (editing) $('msgIn').value = '';
  clearCompose(); openMsg = null; lastDocs = []; readsData = {}; settings = {}; justOpened = true; updateHeader(); $('msgs').innerHTML = '';
  if (unsubChat) unsubChat(); if (unsubReads) { unsubReads(); unsubReads = null; } if (unsubSet) unsubSet();
  if (unsubTyping) { unsubTyping(); unsubTyping = null; } typingData = {}; updateTyping();
  if (canSend) unsubTyping = onSnapshot(doc(db,'typing',readId()), s => { typingData = s.data() || {}; updateTyping(); }, () => {});
  applyChatState(); touchSeen();
  unsubSet = onSnapshot(doc(db,'chatset',readId()), s => { settings = s.data() || {}; applyChatState(); if (modalKind === 'tools') renderTools(); }, () => {});
  if (canSend) unsubReads = onSnapshot(doc(db,'reads',readId()), s => { readsData = s.data() || {}; render(); markRead(); }, () => {});
  unsubChat = onSnapshot(query(colRef(), orderBy('ts','asc'), limit(300)), snap => { lastDocs = snap.docs; render(); markRead(); },
    err => toast('Cannot open this chat: ' + err.code));
}

async function send(){
  const text = $('msgIn').value.trim(); if (!text) return;
  if (editing) {                                                   // edits never send a push notification
    const e = editing; $('msgIn').value = ''; clearCompose();
    if (text === e.old) return;
    try { await updateDoc(e.ref, {text, edited:true, history:arrayUnion({t:e.old, at:Date.now()})}); }
    catch (err) { toast(err.code === 'permission-denied' ? 'Edit failed: the 15-minute edit time is over' : 'Edit failed: ' + err.code); }
    return;
  }
  const cs = composerState(); if (!cs.ok || cs.soft) return toast(cs.msg);
  $('msgIn').value = ''; const c = chat, r = replyTo; clearCompose();
  const data = {from:me, name:nm(me), text, ts:serverTimestamp()}; if (r) data.reply = r;
  try {
    const key = readId(), b = writeBatch(db);
    b.set(doc(colRef()), data);
    if ((settings.slow | 0) > 0) b.set(doc(db,'lastmsg', key + '__' + me), {t:serverTimestamp()});   // proves slow-mode timing to the rules
    await b.commit(); pingWorker(c, text);
  } catch (e) { if (!$('msgIn').value) $('msgIn').value = text; toast(e.code === 'permission-denied' ? 'Blocked: chat locked, you are muted, or slow mode is on' : 'Send failed: ' + e.code); }
}
$('sendBtn').onclick = send;
$('msgIn').onkeydown = e => { if (e.key === 'Enter') send(); };

/* ---------- admin ---------- */

  if (!fromToggle) return;

}

const logAudit = (action, detail) => addDoc(collection(db,'audit'), {by:me, action, chat:chat.label, detail:detail || '', at:serverTimestamp()}).catch(() => {});

  const b = openModal('Edit history', 'history');
  b.append(h('div', {class:'hrow'}, h('b', {text:'Current'}), h('div', {text:m.text})));
  (m.history || []).slice().reverse().forEach(x => b.append(h('div', {class:'hrow'}, h('b', {text:new Date(x.at).toLocaleString()}), h('div', {text:x.t}))));
}

/* chat tools: lock, slow, announce, pin, mute, warn, delete user's messages, export (works in group AND private chats) */
const chatUsers = () => chat.kind === 'dm' ? chat.id.split('__') : [...new Set([...Object.keys(NAMES), ...profiles])].sort();
$('toolsBtn').onclick = () => { openModal('Tools · ' + chat.label, 'tools'); renderTools(); };
function renderTools(){
  const b = $('mBody'); b.innerHTML = '';
  const sec = (t, ...k) => b.append(h('div', {class:'sec'}, h('h4', {text:t}), ...k));
  const sel = arr => { const e = h('select'); arr.forEach(([v, l]) => e.append(h('option', {value:v, text:l}))); return e; };
  const others = chatUsers().filter(u => u !== me), all = chatUsers();
  const opts = list => list.map(u => [u, nm(u)]);

  sec('Lock', h('button', {class: settings.locked ? 'btn-clear' : 'btn-back', text: settings.locked ? '🔓 Unlock chat' : '🔒 Lock chat (read-only for everyone else)',
    onclick: () => setSet({locked: !settings.locked}, settings.locked ? 'unlock' : 'lock', '')}));

  const slow = sel([[0,'Off'],[5,'5 seconds'],[10,'10 seconds'],[30,'30 seconds'],[60,'1 minute'],[300,'5 minutes']]);
  slow.value = String(settings.slow | 0);
  slow.onchange = () => setSet({slow: +slow.value}, 'slow-mode', slow.value + 's');
  sec('Slow mode (time between messages per person)', slow);

  const ann = h('input', {placeholder:'Announcement text…', maxlength:'300'});
  const annRow = h('div', {class:'row'}, ann, h('button', {text:'Post', onclick: () => { const t = ann.value.trim(); if (t) setSet({announce:{text:t, by:me, at:Date.now()}}, 'announce', t); }}));
  if (settings.announce) annRow.append(h('button', {class:'btn-clear', text:'Remove', onclick: () => setSet({announce: deleteField()}, 'announce-remove', '')}));
  sec('Announcement banner', annRow, h('p', {class:'hint', text: settings.announce ? 'Showing: ' + settings.announce.text : 'Shows at the top of this chat for everyone.'}));

  sec('Pinned message', h('p', {class:'hint', text: settings.pin ? '📌 ' + settings.pin.name + ': ' + settings.pin.text : 'Nothing pinned. Tap a message, then 📌.'}),
    settings.pin ? h('button', {class:'btn-clear', text:'Unpin', onclick: () => setSet({pin: deleteField()}, 'unpin', '')}) : '');

  if (others.length) {
    const mu = sel(opts(others)), du = sel([[10,'10 minutes'],[60,'1 hour'],[1440,'24 hours']]);
    const active = Object.entries(settings.mutes || {}).filter(([, t]) => tms(t) > Date.now());
    sec('Mute user', h('div', {class:'row'}, mu, du, h('button', {text:'Mute', onclick: () => setSet({mutes:{[mu.value]: new Date(Date.now() + du.value * 60000)}}, 'mute', nm(mu.value) + ' ' + du.options[du.selectedIndex].text)})),
      ...active.map(([u, t]) => h('div', {class:'row', style:'margin-top:8px'}, h('span', {text:'🔇 ' + nm(u) + ' until ' + new Date(tms(t)).toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'})}),
        h('button', {text:'Unmute', onclick: () => setSet({mutes:{[u]: deleteField()}}, 'unmute', nm(u))}))));

    const wu = sel(opts(others)), wt = h('input', {placeholder:'Private warning…', maxlength:'200'});
    sec('Warn user (private pop-up only they see)', h('div', {class:'row'}, wu, wt, h('button', {text:'Send', onclick: async () => {
      const t = wt.value.trim(); if (!t) return;
      try { await setDoc(doc(db,'warn',wu.value), {text:t, at:Date.now(), by:me}); logAudit('warn', nm(wu.value) + ': ' + t); wt.value = ''; toast('Warning sent'); } catch (e) { toast('Failed: ' + e.code); } }})));
  }

  const du2 = sel(opts(all));
  sec('Delete all messages from one user (this chat)', h('div', {class:'row'}, du2, h('button', {class:'btn-clear', text:'Delete', onclick: () => deleteUserMsgs(du2.value)})));
  sec('Export', h('button', {text:'⬇ Download this chat (.txt)', onclick: exportChat}));
}
async function deleteUserMsgs(u){
  if (!confirm('Delete ALL messages from ' + nm(u) + ' in "' + chat.label + '"?')) return;
  try {
    const s = await getDocs(query(colRef(), where('from','==',u))); if (!s.size) return toast('No messages from ' + nm(u));
    let b = writeBatch(db), n = 0;
    for (const d of s.docs) { b.delete(d.ref); if (++n % 400 === 0) { await b.commit(); b = writeBatch(db); } }
    await b.commit(); logAudit('delete-user-messages', nm(u) + ' (' + n + ')'); toast(n + ' messages deleted');
  } catch (e) { toast('Failed: ' + e.code); }
}
async function exportChat(){
  try {
    const s = await getDocs(query(colRef(), orderBy('ts','asc')));
    const lines = s.docs.map(d => { const m = d.data(); return '[' + (m.ts ? m.ts.toDate().toLocaleString() : '?') + '] ' + (m.name || m.from) + (m.edited ? ' (edited)' : '') + ': ' + m.text; });
    const a = h('a', {href:URL.createObjectURL(new Blob([lines.join('\n')], {type:'text/plain'})), download:'chat-' + chat.label.replace(/[^\w]+/g, '_') + '.txt'});
    document.body.append(a); a.click(); a.remove(); logAudit('export', lines.length + ' messages'); toast('Exported ' + lines.length + ' messages');
  } catch (e) { toast('Export failed: ' + e.code); }
}

/* activity panel + audit log */
$('actBtn').onclick = async () => {
  const b = openModal('Activity', 'activity'); b.append(h('p', {class:'hint', text:'Loading…'}));
  const users = [...new Set([...Object.keys(NAMES), ...profiles])].sort();
  const rows = await Promise.all(users.map(async u => {
    let notif = '?', cnt = '?';
    try { const t = await getDoc(doc(db,'tokens',u)); notif = (t.exists() && (t.data().tokens || []).length) ? '✅' : '❌'; } catch {}
    try { cnt = (await getCountFromServer(query(collection(db,'group'), where('from','==',u)))).data().count; } catch {}
    return {u, notif, cnt};
  }));
  if (modalKind !== 'activity') return;
  b.innerHTML = '';
  const tr = (cells, th) => h('tr', {}, ...cells.map(c => h(th ? 'th' : 'td', {text:String(c)})));
  b.append(h('div', {class:'tbl-wrap'}, h('table', {class:'tbl'}, tr(['User','Status','Notifications','Group msgs'], true),
    ...rows.map(r => { const p = presence[r.u]; return tr([nm(r.u), isOnline(r.u) ? '🟢 online' : (p && p.t ? 'last seen ' + ago(p.t) : 'never'), r.notif, r.cnt]); }))));
};
$('auditBtn').onclick = async () => {
  const b = openModal('Audit log', 'audit'); b.append(h('p', {class:'hint', text:'Loading…'}));
  try {
    const s = await getDocs(query(collection(db,'audit'), orderBy('at','desc'), limit(100)));
    if (modalKind !== 'audit') return; b.innerHTML = '';
    if (!s.size) b.append(h('p', {class:'hint', text:'Nothing logged yet.'}));
    s.docs.forEach(d => { const x = d.data();
      b.append(h('div', {class:'arow'}, h('b', {text:(x.at ? x.at.toDate().toLocaleString() : '…') + ' · ' + nm(x.by) + ' · ' + x.action}), h('span', {text:(x.chat || '') + (x.detail ? ' — ' + x.detail : '')}))); });
  } catch (e) { b.innerHTML = ''; b.append(h('p', {class:'hint', text:'Could not load: ' + e.code})); }
};

/* ---------- voice calls (WebRTC, signaling through Firestore) ---------- */
let pc = null, localStream = null, callRef = null, callUnsubs = [], pendingICE = [], callRole = '', callPeer = '';
let callStart = 0, callTimer = null, callTimeout = null, incomingOffer = null, ac = null, ringT = null, titleT = null, iceCache = null, iceAt = 0;
const fmt = s => Math.floor(s/60) + ':' + String(s % 60).padStart(2,'0');

async function getIce(){
  if (iceCache && Date.now() - iceAt < 1800000) return iceCache;
  let list = [{urls:'stun:stun.l.google.com:19302'}, {urls:'stun:stun1.l.google.com:19302'}];
  if (WORKER_URL && auth.currentUser) {
    try {
      const idToken = await auth.currentUser.getIdToken(), ctl = new AbortController(), t = setTimeout(() => ctl.abort(), 3000);
      const r = await fetch(WORKER_URL, {method:'POST', signal:ctl.signal, headers:{'Content-Type':'application/json'}, body:JSON.stringify({idToken, action:'turn'})});
      clearTimeout(t);
      const turn = r.ok ? await r.json() : [];
      if (Array.isArray(turn) && turn.length) list = list.concat(turn);
    } catch {}
  }
  iceCache = list; iceAt = Date.now(); return list;
}
function ring(kind){
  stopRing();
  try {
    ac = ac || new (window.AudioContext || window.webkitAudioContext)(); ac.resume();
    const beep = () => { const o = ac.createOscillator(), g = ac.createGain(), t = ac.currentTime;
      o.frequency.value = kind === 'in' ? 880 : 440; o.connect(g); g.connect(ac.destination);
      g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.25, t + 0.03); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.7);
      o.start(t); o.stop(t + 0.8); if (kind === 'in' && navigator.vibrate) navigator.vibrate([300,150,300]); };
    beep(); ringT = setInterval(beep, kind === 'in' ? 1600 : 3000);
  } catch {}
}
function stopRing(){ clearInterval(ringT); ringT = null; try { navigator.vibrate && navigator.vibrate(0); } catch {} }
function flashTitle(on, who){
  clearInterval(titleT); document.title = 'NEON CHAT';
  if (on) { let f = 0; titleT = setInterval(() => { document.title = (f ^= 1) ? '📞 ' + who + ' calling…' : 'NEON CHAT'; }, 800); }
}
function showCallUI(peer, status, incoming){
  $('callName').textContent = nm(peer); $('callAvatar').textContent = nm(peer).charAt(0).toUpperCase();
  $('callStatus').textContent = status; $('callUI').style.display = 'flex';
  $('acceptBtn').style.display = incoming ? 'flex' : 'none';
  $('muteBtn').style.display = incoming ? 'none' : 'flex'; $('muteBtn').textContent = 'Mute';
  $('hangBtn').textContent = incoming ? 'Decline' : 'Hang up';
}
async function setupPC(){
  const iceServers = await getIce();
  localStream = await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true, noiseSuppression:true}});
  pc = new RTCPeerConnection({iceServers}); pendingICE = [];
  localStream.getTracks().forEach(t => pc.addTrack(t, localStream));
  pc.ontrack = e => { $('remoteA').srcObject = e.streams[0]; };
  pc.onicecandidate = e => { if (e.candidate && callRef)
    addDoc(collection(callRef, callRole === 'caller' ? 'callerCandidates' : 'calleeCandidates'), e.candidate.toJSON()).catch(() => {}); };
  pc.onconnectionstatechange = () => {
    const s = pc && pc.connectionState;
    if (s === 'connected') { stopRing(); if (!callStart) { callStart = Date.now(); callTimer = setInterval(tick, 1000); tick(); } }
    if (s === 'failed') { toast('Call could not connect'); endCall(true); }
  };
}
function tick(){ $('callStatus').textContent = fmt(Math.floor((Date.now() - callStart) / 1000)); }
async function addCandidate(c){ if (pc && pc.remoteDescription) await pc.addIceCandidate(c).catch(() => {}); else pendingICE.push(c); }
async function flushICE(){ const l = pendingICE; pendingICE = []; for (const c of l) await pc.addIceCandidate(c).catch(() => {}); }
function watchCandidates(sub){
  callUnsubs.push(onSnapshot(collection(callRef, sub), s => s.docChanges().forEach(c => { if (c.type === 'added') addCandidate(c.doc.data()); })));
}
function watchCallState(){
  const ref = callRef;
  callUnsubs.push(onSnapshot(ref, async s => {
    const d = s.data(); if (!d || callRef !== ref) return;
    if (callRole === 'caller' && d.answer && pc && !pc.remoteDescription) {
      try { await pc.setRemoteDescription(d.answer); flushICE(); stopRing(); $('callStatus').textContent = 'Connecting…'; } catch {}
    }
    if (d.status === 'ended' || d.status === 'declined') { if (d.status === 'declined') toast(nm(callPeer) + ' declined'); endCall(false); }
  }));
}

async function startCall(){
  if (pc || callRef || chat.kind !== 'dm' || !chat.id.split('__').includes(me)) return;
  const dmId = chat.id, ref = doc(collection(db, 'calls'));
  callPeer = dmId.split('__').find(x => x !== me); callRole = 'caller'; callRef = ref;
  showCallUI(callPeer, 'Calling…', false); ring('out');
  try { await setupPC(); } catch { toast('Allow the microphone to make calls'); return endCall(false, false); }
  if (callRef !== ref) return;
  const offer = await pc.createOffer();
  await setDoc(ref, {from:me, to:callPeer, status:'ringing', ts:serverTimestamp(), offer:{type:offer.type, sdp:offer.sdp}});  // before candidates start
  if (callRef !== ref) return;
  await pc.setLocalDescription(offer);
  pingWorker({kind:'call', id:dmId}, '');
  watchCandidates('calleeCandidates'); watchCallState();
  callTimeout = setTimeout(() => { if (callRef === ref && !callStart) { toast('No answer'); endCall(true); } }, 45000);
}

function showIncoming(snap){
  const d = snap.data();
  if (d.ts && Date.now() - d.ts.toMillis() > 45000) return;                    // stale
  if (callRef) { updateDoc(snap.ref, {status:'declined'}).catch(() => {}); return; }   // already busy
  callRef = snap.ref; callRole = 'callee'; callPeer = d.from; incomingOffer = d.offer;
  showCallUI(d.from, 'Incoming voice call…', true); ring('in'); flashTitle(true, nm(d.from)); watchCallState();
  if (document.hidden && typeof Notification !== 'undefined' && Notification.permission === 'granted' && !(WORKER_URL && localStorage.getItem('fcmToken')))
    navigator.serviceWorker?.getRegistration().then(r => r && r.showNotification('📞 ' + nm(d.from) + ' is calling', {body:'Incoming voice call', tag:'call' + snap.id, requireInteraction:true})).catch(() => {});
  const ref = snap.ref; callTimeout = setTimeout(() => { if (callRef === ref && !pc) endCall(false, false); }, 45000);
}
async function acceptCall(){
  const ref = callRef; stopRing(); flashTitle(false); clearTimeout(callTimeout);
  showCallUI(callPeer, 'Connecting…', false); $('hangBtn').textContent = 'Hang up';
  try { await setupPC(); } catch { toast('Allow the microphone to answer calls'); updateDoc(ref, {status:'declined'}).catch(() => {}); return endCall(false, false); }
  if (callRef !== ref || !pc) return;
  await pc.setRemoteDescription(incomingOffer); flushICE();
  const ans = await pc.createAnswer(); await pc.setLocalDescription(ans);
  await updateDoc(ref, {answer:{type:ans.type, sdp:ans.sdp}, status:'active'});
  watchCandidates('callerCandidates');
}

async function endCall(notify = true, log = true){
  const ref = callRef, role = callRole, peer = callPeer, dur = callStart ? Math.round((Date.now() - callStart) / 1000) : 0;
  callRef = null; callRole = ''; callPeer = ''; callStart = 0; incomingOffer = null;
  clearInterval(callTimer); clearTimeout(callTimeout); stopRing(); flashTitle(false);
  callUnsubs.forEach(f => f()); callUnsubs = [];
  if (localStream) localStream.getTracks().forEach(t => t.stop()); localStream = null;
  if (pc) { pc.onconnectionstatechange = null; pc.close(); pc = null; }
  $('remoteA').srcObject = null; $('callUI').style.display = 'none';
  if (ref && notify) updateDoc(ref, {status:'ended'}).catch(() => {});
  if (ref && log && role === 'caller' && auth.currentUser)      // the caller writes one history line per call
    addDoc(collection(db, 'dms', [me, peer].sort().join('__'), 'messages'),
      {from:me, name:nm(me), text: dur ? '📞 Voice call · ' + fmt(dur) : '📞 Missed call', ts:serverTimestamp()}).catch(() => {});
}
$('callBtn').onclick = startCall;
$('acceptBtn').onclick = acceptCall;
$('hangBtn').onclick = () => {
  if (callRole === 'callee' && !pc) { updateDoc(callRef, {status:'declined'}).catch(() => {}); endCall(false, false); } else endCall(true);
};
$('muteBtn').onclick = () => { const t = localStream && localStream.getAudioTracks()[0]; if (t) { t.enabled = !t.enabled; $('muteBtn').textContent = t.enabled ? 'Mute' : 'Unmute'; } };

/* ---------- notifications ---------- */
let messaging = null;
try { messaging = getMessaging(app); } catch {}
async function registerPush(){
  const reg = await navigator.serviceWorker.register('./firebase-messaging-sw.js');
  const token = await getToken(messaging, {vapidKey:VAPID_KEY, serviceWorkerRegistration:reg});
  await setDoc(doc(db,'tokens',me), {tokens:arrayUnion(token)}, {merge:true});
  localStorage.setItem('fcmToken', token);
}
async function autoNotif(){
  if (typeof Notification !== 'undefined' && Notification.permission === 'granted') {
    $('notifBtn').textContent = 'Alerts on ✓';
    if (messaging) registerPush().catch(() => {});
  }
}
$('notifBtn').onclick = async () => {
  if (typeof Notification === 'undefined') return toast('Notifications are not supported in this browser');
  if (await Notification.requestPermission() !== 'granted') return toast('Notifications were blocked');
  $('notifBtn').textContent = 'Alerts on ✓'; toast('Alerts enabled on this device');
  if (messaging) { try { await registerPush(); } catch (e) { console.warn('push token failed', e); } }
};
</script>
