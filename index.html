<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>NEON CHAT</title>
<style>
:root{--grad-1:#ff00cc;--grad-2:#3333ff;--grad-3:#00d4ff;--neon-green:#00ffcc;--g1-rgb:255,0,204;--g3-rgb:0,212,255;--ng-rgb:0,255,204;--ov:255,255,255;--neon-border:rgba(var(--ov),.1);
--bg1:#050505;--bg2:#1a1a2e;--bg3:#16213e;--bg4:#0f3460;--panel-bg:rgba(10,10,25,.9);--solid:#0b0b1c;--head:rgba(0,0,0,.7);--login:rgba(5,5,5,.85);--text:#fff;--sub:#ccc;--muted:#888;--on-acc:#000;--ann:#ffd54a}
*{box-sizing:border-box}
body{margin:0;font-family:'Segoe UI',Roboto,sans-serif;height:100vh;height:100dvh;display:flex;flex-direction:column;overflow:hidden;color:var(--text);
background:linear-gradient(-45deg,var(--bg1),var(--bg2),var(--bg3),var(--bg4));background-size:400% 400%;animation:bg 15s ease infinite}
@keyframes bg{0%,100%{background-position:0% 50%}50%{background-position:100% 50%}}
button{position:relative;background:rgba(var(--ov),.05);color:var(--text);border:2px solid var(--neon-green);padding:10px 20px;border-radius:12px;font-weight:800;cursor:pointer;overflow:hidden;transition:all .3s;text-transform:uppercase;font-size:11px;letter-spacing:1px;display:flex;align-items:center;justify-content:center}
button::before{content:'';position:absolute;top:0;left:-100%;width:100%;height:100%;background:linear-gradient(90deg,transparent,rgba(var(--ov),.4),transparent);transition:.5s}
button:hover::before{left:100%}
button:hover{transform:translateY(-3px);background:var(--neon-green);color:var(--on-acc);box-shadow:0 0 30px rgba(var(--ng-rgb),.5)}
.btn-clear{border-color:#ff4b2b;color:#ff4b2b}.btn-clear:hover{background:#ff4b2b;color:#fff;box-shadow:0 0 30px rgba(255,75,43,.5)}
.btn-back{border-color:var(--grad-3);color:var(--grad-3)}.btn-back:hover{background:var(--grad-3);color:var(--on-acc);box-shadow:0 0 30px rgba(var(--g3-rgb),.5)}
.logo{font-size:1.4rem;font-weight:900;background:linear-gradient(to right,var(--grad-1),var(--grad-3));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
input{background:rgba(var(--ov),.05);color:var(--neon-green);border:2px solid var(--neon-border);border-radius:12px;padding:12px 16px;font-size:15px;outline:none;font-family:inherit;width:100%}
input:focus{border-color:var(--neon-green)}
/* login */
#login{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;align-items:center;z-index:100;background:var(--login);backdrop-filter:blur(25px);gap:16px;padding:20px}
.studio-title{font-size:clamp(2.5rem,8vw,4.5rem);font-weight:900;margin:0 0 20px;background:linear-gradient(to right,var(--grad-1),var(--grad-3));-webkit-background-clip:text;-webkit-text-fill-color:transparent;filter:drop-shadow(0 0 20px rgba(var(--g1-rgb),.5));letter-spacing:-2px}
#login form{width:min(360px,100%);padding:40px 32px;background:var(--panel-bg);border:1px solid var(--neon-border);border-radius:30px;display:flex;flex-direction:column;gap:14px}
#login form:focus-within{border-color:var(--grad-1);box-shadow:0 0 60px rgba(var(--g1-rgb),.2)}
#err{color:#ff5555;font-size:13px;min-height:16px;text-align:center}
/* app */
#app{display:none;flex:1;flex-direction:column;min-height:0}
header{padding:12px 24px;background:var(--head);backdrop-filter:blur(15px);border-bottom:2px solid var(--neon-border);display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px}
.tool-bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
#whoami{color:var(--muted);font-size:12px;font-weight:800}
.container{display:grid;grid-template-columns:minmax(220px,300px) 1fr;flex:1;gap:20px;padding:20px;min-height:0;width:100%;max-width:1500px;margin:0 auto}
.panel{background:var(--panel-bg);border-radius:24px;border:1px solid var(--neon-border);display:flex;flex-direction:column;overflow:hidden;min-height:0}
.panel-header{padding:12px 22px;background:rgba(var(--ov),.03);display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--neon-border);font-size:11px;font-weight:800;color:var(--muted);text-transform:uppercase;gap:8px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--grad-1);box-shadow:0 0 8px var(--grad-1)}
#members{overflow-y:auto;padding:10px;display:flex;flex-direction:column;gap:8px}
.mem{padding:12px 16px;border-radius:14px;border:1px solid var(--neon-border);cursor:pointer;display:flex;justify-content:space-between;align-items:center;transition:.25s;font-weight:700;font-size:14px}
.mem:hover{border-color:var(--grad-3);transform:translateX(4px)}
.mem.active{border-color:var(--grad-1);box-shadow:0 0 20px rgba(var(--g1-rgb),.25);background:rgba(var(--g1-rgb),.08)}
.mem small{color:var(--muted);font-weight:600}
.kick{padding:4px 8px;font-size:10px;border-color:#ff4b2b;color:#ff4b2b}
#msgs{flex:1;overflow-y:auto;padding:20px;display:flex;flex-direction:column;gap:10px}
.msg{max-width:75%;padding:10px 14px;border-radius:16px;background:rgba(var(--ov),.06);border:1px solid var(--neon-border);align-self:flex-start;word-wrap:break-word;position:relative}
.msg.mine{align-self:flex-end;background:rgba(var(--ng-rgb),.08);border-color:rgba(var(--ng-rgb),.35)}
.msg b{font-size:12px;color:var(--grad-3);cursor:pointer;display:inline-block;margin-right:8px}
.msg.mine b{color:var(--neon-green);cursor:default}
.msg time{font-size:10px;color:var(--muted)}
.msg .txt{margin-top:3px;font-size:15px;line-height:1.45;white-space:pre-wrap}
.mention{color:var(--grad-1);font-weight:800}.mention.me{background:rgba(var(--g1-rgb),.2);border-radius:6px;padding:0 4px}
.del{position:absolute;top:6px;right:6px;padding:0 7px;font-size:11px;border-width:1px;border-color:#ff4b2b;color:#ff4b2b;border-radius:8px}
#sendbar{display:flex;gap:10px;padding:14px;border-top:1px solid var(--neon-border)}
.msg time{margin-right:2px}.edited{color:var(--muted);font-size:10px}
.quote{margin:5px 0 2px;padding:5px 8px;border-left:3px solid var(--grad-1);background:rgba(var(--ov),.06);border-radius:6px;font-size:12px;cursor:pointer;color:var(--sub);overflow:hidden}
.quote span:first-child{color:var(--grad-1);font-weight:800;margin-right:6px}
.tick{text-align:right;font-size:11px;color:var(--muted);margin-top:2px;user-select:none}.tick.seen{color:var(--neon-green);text-shadow:0 0 6px rgba(var(--ng-rgb),.6)}
.acts{display:none;gap:6px;margin-top:4px}.msg.open .acts{display:flex}
@media(hover:hover){.msg:hover .acts{display:flex}}
.acts button{padding:1px 9px;font-size:14px;border-width:1px;border-radius:8px;text-transform:none;letter-spacing:0}
.acts button:hover{transform:none;box-shadow:none}
.msg.flash{animation:flash 1.2s}@keyframes flash{0%,60%{box-shadow:0 0 0 2px var(--grad-1),0 0 20px var(--grad-1)}100%{box-shadow:none}}
#replyBar{display:none;align-items:center;gap:10px;padding:8px 14px;border-top:1px solid var(--neon-border);background:rgba(var(--g1-rgb),.07);font-size:12px;color:var(--sub)}
#replyTxt{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#replyX{padding:2px 9px;font-size:12px;border-color:#ff4b2b;color:#ff4b2b}
.pdot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#00e676;box-shadow:0 0 8px #00e676;margin-right:7px}
#chatSub{text-transform:none;font-weight:700;margin-left:8px;color:var(--muted)}#chatSub.on{color:#00e676}
#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--solid);border:2px solid var(--neon-green);padding:12px 22px;border-radius:14px;font-weight:700;display:none;z-index:200;box-shadow:0 0 30px rgba(var(--ng-rgb),.4)}
#callUI{position:fixed;inset:0;z-index:150;display:none;flex-direction:column;align-items:center;justify-content:center;gap:16px;background:var(--solid);backdrop-filter:blur(20px);padding:20px;text-align:center}
#callAvatar{width:120px;height:120px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:3rem;font-weight:900;background:linear-gradient(135deg,var(--grad-1),var(--grad-3));animation:ringPulse 1.6s infinite}
@keyframes ringPulse{0%{box-shadow:0 0 0 0 rgba(var(--g1-rgb),.55)}100%{box-shadow:0 0 0 48px rgba(var(--g1-rgb),0)}}
#callName{font-size:1.8rem;font-weight:900}#callStatus{color:var(--muted);font-weight:700;letter-spacing:1px;min-height:18px}
.call-btns{display:flex;gap:14px;margin-top:22px}
@media(prefers-reduced-motion:reduce){#callAvatar{animation:none}}
select{background:rgba(var(--ov),.05);color:var(--neon-green);border:2px solid var(--neon-border);border-radius:12px;padding:10px 12px;font:inherit;font-size:14px;outline:none;max-width:100%}
select:focus{border-color:var(--neon-green)}option{background:var(--solid);color:var(--text)}
#typingBar{display:none;padding:2px 18px 6px;font-size:12px;color:var(--grad-3);font-weight:700;font-style:italic}
.badge{background:var(--grad-1);color:#fff;border-radius:11px;padding:1px 8px;font-size:11px;font-weight:900;margin-left:8px;box-shadow:0 0 10px rgba(var(--g1-rgb),.6)}
#msgWrap{position:relative;flex:1;min-height:0;display:flex}#msgWrap #msgs{flex:1;min-width:0}
#jumpBtn{display:none;position:absolute;right:16px;bottom:12px;padding:6px 14px;border-radius:20px;font-size:12px;background:var(--solid);border-color:var(--grad-3);color:var(--grad-3);z-index:5}
.dsep{align-self:center;font-size:11px;font-weight:800;color:var(--muted);background:rgba(var(--ov),.05);border:1px solid var(--neon-border);border-radius:12px;padding:2px 12px;margin:6px 0;letter-spacing:.5px;text-transform:uppercase}
.txt.gone{color:var(--muted);font-style:italic}.txt a{color:var(--grad-3);text-decoration:underline;word-break:break-all}
.fxtag{font-size:10px;color:var(--grad-1);cursor:pointer;font-weight:800}.starmark{font-size:11px}
#suggest{display:none;flex-wrap:wrap;gap:6px;padding:8px 14px;border-top:1px solid var(--neon-border);background:rgba(var(--ov),.03);max-height:110px;overflow:auto}
#suggest .sg{padding:5px 12px;font-size:12px;border-width:1px;border-radius:14px;text-transform:none;letter-spacing:0}#suggest .sg.on{background:var(--neon-green);color:var(--on-acc)}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:175}
@keyframes quake{0%,100%{transform:none}10%{transform:translate(-14px,8px)}20%{transform:translate(12px,-10px)}30%{transform:translate(-10px,-6px)}40%{transform:translate(14px,6px)}50%{transform:translate(-8px,10px)}60%{transform:translate(10px,-8px)}70%{transform:translate(-12px,4px)}80%{transform:translate(6px,-4px)}90%{transform:translate(-4px,2px)}}
@keyframes glitch{0%,100%{filter:none;transform:none}10%{filter:hue-rotate(90deg) drop-shadow(5px 0 #f0f) drop-shadow(-5px 0 #0ff);transform:translate(-8px,2px) skewX(5deg)}20%{filter:invert(1);transform:translate(8px,-3px)}30%{filter:hue-rotate(200deg) contrast(1.7);transform:translate(-4px,5px) skewX(-6deg)}45%{filter:none;transform:none}55%{filter:saturate(4) drop-shadow(-6px 0 #f00) drop-shadow(6px 0 #00f);transform:translate(10px,0) skewX(3deg)}70%{filter:invert(1) hue-rotate(120deg);transform:translate(-6px,-4px)}85%{filter:contrast(2);transform:translate(3px,3px) skewX(-2deg)}}
#app.quake{animation:quake .9s}#app.glitch{animation:glitch 1.4s steps(2,end)}
.opt{width:100%;margin:5px 0;padding:14px;font-size:13px}.opt.on{background:var(--neon-green);color:var(--on-acc)}
.themes{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.sw{height:70px;border-radius:14px;border:2px solid var(--neon-border);color:#fff;text-shadow:0 1px 4px #000;font-size:12px}.sw.on{border-color:var(--text);box-shadow:0 0 0 2px var(--neon-green)}
#adminBar{display:none;gap:10px;padding:8px 24px;background:rgba(255,0,100,.06);border-bottom:1px solid var(--neon-border);flex-wrap:wrap}
#annBar{display:none;padding:9px 18px;background:rgba(255,200,0,.1);border-bottom:1px solid rgba(255,200,0,.35);color:var(--ann);font-size:13px;font-weight:700;word-break:break-word}
#pinBar{display:none;align-items:center;gap:10px;padding:8px 18px;background:rgba(var(--g3-rgb),.07);border-bottom:1px solid var(--neon-border);font-size:12px;color:var(--sub)}
#pinTxt{flex:1;cursor:pointer;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#unpinBtn{padding:1px 8px;font-size:11px;border-width:1px;border-color:#ff4b2b;color:#ff4b2b}
.acts{flex-wrap:wrap;align-items:center}.picker{display:flex;gap:2px;margin-right:6px}
.acts .picker button{border:none;background:none;padding:1px 4px;font-size:17px}
.rxrow{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}
.rx{padding:1px 9px;font-size:12px;border-width:1px;border-radius:14px;text-transform:none;letter-spacing:0;border-color:var(--neon-border)}
.rx.me{border-color:var(--grad-1);background:rgba(var(--g1-rgb),.16)}.rx:hover{transform:none;box-shadow:none}
#modal{display:none;position:fixed;inset:0;z-index:180;background:rgba(0,0,0,.72);backdrop-filter:blur(6px);align-items:center;justify-content:center;padding:16px}
#modal .card{width:min(580px,100%);max-height:90vh;max-height:90dvh;overflow:auto;background:var(--solid);border:1px solid var(--neon-border);border-radius:22px;padding:18px 20px;box-shadow:0 0 60px rgba(var(--g1-rgb),.18)}
.mh{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;font-size:16px;font-weight:900}
.mh button{padding:2px 10px;font-size:12px}
.sec{padding:12px 0;border-bottom:1px solid var(--neon-border)}.sec:last-child{border:none}
.sec h4{margin:0 0 8px;color:var(--grad-3);font-size:11px;text-transform:uppercase;letter-spacing:1px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.row input{flex:1;min-width:140px}
.hint{color:var(--muted);font-size:12px;margin:6px 0 0}
.hrow,.arow{padding:8px 0;border-bottom:1px solid var(--neon-border);font-size:13px;color:var(--sub);word-break:break-word}
.hrow b,.arow b{display:block;font-size:11px;color:var(--grad-3)}
.tbl-wrap{overflow-x:auto}.tbl{width:100%;border-collapse:collapse;font-size:13px;white-space:nowrap}
.tbl th,.tbl td{text-align:left;padding:8px 8px;border-bottom:1px solid var(--neon-border)}.tbl th{color:var(--muted);font-size:11px;text-transform:uppercase}
@media(min-width:1200px){.container{padding:24px;gap:24px}.msg{max-width:62%}#msgs{padding:24px 28px}}
@media(max-width:1000px) and (min-width:761px){.container{grid-template-columns:210px 1fr;gap:14px;padding:14px}}
@media(max-width:760px){
  header{padding:8px 12px;padding-top:calc(8px + env(safe-area-inset-top))}
  .logo{font-size:1.1rem}
  .tool-bar{width:100%;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none}.tool-bar>*{flex:0 0 auto}
  #adminBar{padding:6px 12px;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none}#adminBar>*{flex:0 0 auto}
  .container{grid-template-columns:1fr;grid-template-rows:auto minmax(0,1fr);padding:8px;gap:8px}
  .container>.panel:first-child .panel-header{display:none}
  #members{flex-direction:row;overflow-x:auto;overflow-y:hidden;padding:8px;gap:8px}
  .mem{flex:0 0 auto;padding:8px 12px;white-space:nowrap;font-size:13px}.mem small{display:none}.mem:hover{transform:none}
  .panel{border-radius:18px}.msg{max-width:90%}#msgs{padding:12px}
  #sendbar{padding:10px;padding-bottom:calc(10px + env(safe-area-inset-bottom))}
  input,select{font-size:16px}
  .acts button{min-height:34px;min-width:34px}.acts .picker button{font-size:20px}
  #modal{align-items:flex-end;padding:0}#modal .card{border-radius:22px 22px 0 0;max-height:88vh;max-height:88dvh;padding-bottom:calc(18px + env(safe-area-inset-bottom))}
  #toast{width:calc(100% - 24px);bottom:90px;text-align:center}
}
</style>
</head>
<body>

<div id="login">
  <h1 class="studio-title">NEON CHAT</h1>
  <form id="loginForm">
    <input id="u" placeholder="Username" autocomplete="username" required>
    <input id="p" type="password" placeholder="Password" autocomplete="current-password" required>
    <button type="submit">Log in</button>
    <div id="err"></div>
  </form>
</div>

<div id="app">
  <header>
    <div class="logo">NEON // CHAT</div>
    <div class="tool-bar">
      <span id="whoami"></span>
      <button id="adminToggle" class="btn-back" style="display:none"></button>
      <button id="starsBtn" class="btn-back">⭐ Saved</button>
      <button id="soundBtn" class="btn-back">🔔 Alert</button>
      <button id="themeBtn" class="btn-back">🎨 Theme</button>
      <button id="notifBtn" class="btn-back">Enable notifications</button>
      <button class="btn-clear" id="outBtn">Log out</button>
    </div>
  </header>
  <div id="adminBar" class="admin-only">
    <button class="btn-clear" id="clearBtn">Clear history</button>
    <button class="btn-clear" id="kickAllBtn">Log out others</button>
    <button class="btn-back" id="monBtn">Monitor DM</button>
    <button class="btn-back" id="actBtn">Activity</button>
    <button class="btn-back" id="auditBtn">Audit log</button>
  </div>
  <div class="container">
    <div class="panel">
      <div class="panel-header">Members <div class="dot"></div></div>
      <div id="members"></div>
    </div>
    <div class="panel">
      <div class="panel-header"><span><span id="chatTitle">Group chat</span><small id="chatSub"></small></span><span style="display:flex;gap:10px;align-items:center"><button id="toolsBtn" class="btn-back admin-only" style="display:none;padding:5px 12px">🛠 Tools</button><button id="callBtn" style="display:none;padding:5px 12px">📞 Call</button><div class="dot" style="background:var(--grad-3);box-shadow:0 0 8px var(--grad-3)"></div></span></div>
      <div id="annBar"></div>
      <div id="pinBar"><span id="pinTxt"></span><button id="unpinBtn">✕</button></div>
      <div id="msgWrap"><div id="msgs"></div><button id="jumpBtn">⬇</button></div>
      <div id="typingBar"></div>
      <div id="replyBar"><span id="replyTxt"></span><button id="replyX">✕</button></div>
      <div id="suggest"></div>
      <div id="sendbar">
        <input id="msgIn" placeholder="Message… use @username to notify someone" autocomplete="off">
        <button id="sendBtn">Send</button>
      </div>
    </div>
  </div>
</div>
<div id="callUI">
  <div id="callAvatar"></div><div id="callName"></div><div id="callStatus"></div>
  <audio id="remoteA" autoplay></audio>
  <div class="call-btns">
    <button id="acceptBtn" style="display:none">Accept</button>
    <button id="muteBtn" class="btn-back">Mute</button>
    <button id="hangBtn" class="btn-clear">Hang up</button>
  </div>
</div>
<div id="modal"><div class="card"><div class="mh"><span id="mTitle"></span><button id="mX" class="btn-clear">✕</button></div><div id="mBody"></div></div></div>
<canvas id="fx"></canvas>
<div id="toast"></div>

<script type="module">

/* ---------- login ---------- */
$('loginForm').onsubmit = async e => {
  e.preventDefault(); $('err').textContent = '';
  const u = $('u').value.trim().toLowerCase();
  try { await signInWithEmailAndPassword(auth, EMAILS[u] || (u.includes('@') ? u : `${u}@${EMAIL_DOMAIN}`), $('p').value); }
  catch { $('err').textContent = 'Wrong username or password.'; }
};
$('outBtn').onclick = logout;
// Log out = remove THIS device's notification token from the account, then sign out
async function logout(){
  if (callRef) endCall(true, false);
  try { const t = localStorage.getItem('fcmToken'); if (t && me) await setDoc(doc(db,'tokens',me), {tokens:arrayRemove(t)}, {merge:true}); } catch {}
  try { if (me) await setDoc(doc(db,'presence',me), {online:false, t:serverTimestamp()}); } catch {}
  localStorage.removeItem('fcmToken'); signOut(auth);
}

onAuthStateChanged(auth, async user => {
  if (callRef || pc) endCall(true, false);
  unsubs.forEach(f => f()); unsubs = []; if (unsubChat) unsubChat();
  dmWatch.forEach(f => f()); dmWatch.clear();
  if (unsubReads) { unsubReads(); unsubReads = null; } if (unsubSet) { unsubSet(); unsubSet = null; } if (unsubTyping) { unsubTyping(); unsubTyping = null; }
  unreadWatch.forEach(f => f()); unreadWatch.clear(); unread = {}; lastReadOf = {}; typingData = {}; starred = new Map(); clearInterval(hbT); presence = {};
  if (!user) { $('app').style.display = 'none'; $('login').style.display = 'flex'; return; }
  me = user.email.split('@')[0].toLowerCase();
  isAdmin = user.email.toLowerCase() === ADMIN_EMAIL;
  $('login').style.display = 'none'; $('app').style.display = 'flex'; $('p').value = '';
  adminOn = isAdmin && localStorage.getItem('adminOn') !== '0'; applyAdminUI();
  await setDoc(doc(db,'users',me), {name:nm(me), email:user.email}, {merge:true});

    presence = {}; s.forEach(d => { const v = d.data(); presence[d.id] = {online:!!v.online, t: v.t && v.t.toMillis ? v.t.toMillis() : Date.now()}; });
    updateHeader(); drawMembers();
  }, () => {}));
  unsubs.push(onSnapshot(collection(db,'users'), s => {
    profiles = s.docs.map(d => d.id); drawMembers();
    const mine = s.docs.find(d => d.id === me), tk = mine && mine.data().theme;
    if (tk && tk !== curTheme && THEMES[tk]) { applyTheme(tk); localStorage.setItem('theme', tk); }
  }));
  unsubs.push(onSnapshot(collection(db,'stars',me,'items'), s => { starred = new Map(s.docs.map(x => [x.id, x.data()])); render(); if (modalKind === 'stars') renderStars(); }, () => {}));
  let first = true;   // remote log-out: reacts only to changes made after we logged in
  unsubs.push(onSnapshot(doc(db,'control','logout'), s => {
    if (first) { first = false; return; }
    const d = s.data(); if (!d || isAdmin) return;
    if (d.target === 'all' || d.target === me) { toast('You were logged out by admin'); logout(); }
  }));

    const d = s.data(); if (!d) return; const k = 'warnSeen_' + me;

  unsubs.push(onSnapshot(query(collection(db,'group'), orderBy('ts','desc'), limit(1)), s => {
    if (gFirst) { gFirst = false; return; }
    s.docChanges().forEach(c => { if (c.type === 'added') { const m = c.doc.data(); if (m.from !== me) { bump('group'); ding(); } if (m.from !== me && mention.test(m.text || '')) alertUser(m.name + ' mentioned you', m.text, 'group', ''); } });

  openChat('group', '', 'Group chat');

/* ---------- members ---------- */
function drawMembers(){

  watchDMs(list); watchUnread(list);
  const box = $('members'); box.innerHTML = '';
  const add = (label, sub, active, fn, kickUser, online, count) => {
    const el = document.createElement('div'); el.className = 'mem' + (active ? ' active' : '');
    const l = document.createElement('span'); l.textContent = label;
    const s = document.createElement('small'); s.textContent = sub; l.append(' ', s); if (online) { const d = document.createElement('i'); d.className = 'pdot'; l.prepend(d); } el.append(l);
    if (count) { const bg = document.createElement('span'); bg.className = 'badge'; bg.textContent = count > 99 ? '99+' : count; l.append(bg); }
    if (kickUser && adm()) { const k = document.createElement('button'); k.className='kick'; k.textContent='Kick';
      k.onclick = ev => { ev.stopPropagation(); setDoc(doc(db,'control','logout'), {target:kickUser, at:Date.now()}); toast(nm(kickUser)+' logged out'); };
      el.append(k); }
    el.onclick = fn; box.append(el);
  };
  add('# Group chat', '', chat.kind==='group', () => openChat('group','','Group chat'), null, false, unread.group);
  list.forEach(u => { const id = [me,u].sort().join('__');
    add(nm(u), '@'+u, chat.kind==='dm' && chat.id===id, () => openChat('dm', id, 'Private · '+nm(u)), u, isOnline(u), unread[id]); });
}

/* ---------- in-app alerts (free, work while the site is open) ---------- */

    dmWatch.set(id, onSnapshot(query(collection(db,'dms',id,'messages'), orderBy('ts','desc'), limit(1)), s => {

      s.docChanges().forEach(c => { if (c.type === 'added') { const m = c.doc.data(); if (m.from !== me) { bump(id); ding(); } if (m.from !== me) alertUser(m.name + ' (private)', m.text, 'dm', id); } });
    }, () => {}));

}
function alertUser(title, body, kind, id){
  if (!document.hidden && chat.kind === kind && chat.id === id) return;       // already looking at it
  toast(title + ': ' + body.slice(0, 80));
  if (WORKER_URL && localStorage.getItem('fcmToken')) return;                  // real push already shows it
  if (typeof Notification !== 'undefined' && Notification.permission === 'granted') {
    const o = {body: body.slice(0, 120), tag: kind + id};
    navigator.serviceWorker?.getRegistration().then(r => r ? r.showNotification(title, o) : new Notification(title, o)).catch(() => {});
  }
}

    fetch(WORKER_URL, {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({idToken, kind:c.kind, chat:c.id, text, name:nm(me)})}); } catch {}
}

/* seen */
function markRead(){

  const newest = Math.max(0, ...lastDocs.map(d => d.data()).filter(m => m.from !== me).map(m => tms(m.ts)));
  if (!newest || newest <= tms(readsData[me])) return;
  if (Date.now() - readTimer < 3000) { clearTimeout(markRead.t); markRead.t = setTimeout(markRead, 3000); return; }
  readTimer = Date.now();
  setDoc(doc(db,'reads',readId()), {[me]: serverTimestamp()}, {merge:true}).catch(() => {});
}
function tickEl(m){
  const s = document.createElement('div'); s.className = 'tick'; const ts = tms(m.ts);
  if (!m.ts) { s.textContent = '🕒'; return s; }                       // not on the server yet
  if (chat.kind === 'dm') {
    const peer = chat.id.split('__').find(x => x !== me), seen = tms(readsData[peer]) >= ts;
    s.textContent = seen ? '✓✓' : '✓'; if (seen) s.classList.add('seen');
  } else {
    const names = Object.keys(readsData).filter(u => u !== me && tms(readsData[u]) >= ts);
    if (!names.length) s.textContent = '✓';
    else { s.textContent = '👁 ' + names.length; s.classList.add('seen'); s.style.cursor = 'pointer';
      s.onclick = ev => { ev.stopPropagation(); toast('Seen by: ' + names.map(nm).join(', ')); }; }
  }

}

    [[660, 0], [880, .13]].forEach(([f, dl]) => { const o = dingCtx.createOscillator(), g = dingCtx.createGain(); o.type = 'sine'; o.frequency.value = f; o.connect(g); g.connect(dingCtx.destination);

}

/* drafts, @mention + /effect suggestions */
const draftKey = k => 'draft_' + me + '_' + k;
function hideSuggest(){ $('suggest').style.display = 'none'; sugItems = []; }
function showSuggest(items){
  sugItems = items; sugIdx = 0; const box = $('suggest'); box.innerHTML = '';
  items.forEach((it, i) => { const bt = h('button', {class:'sg' + (i === 0 ? ' on' : ''), text:it.label}); bt.onpointerdown = ev => { ev.preventDefault(); pickSuggest(i); }; box.append(bt); });
  box.style.display = items.length ? 'flex' : 'none';
}
function pickSuggest(i){
  const it = sugItems[i], inp = $('msgIn'); if (!it) return;
  const pos = inp.selectionStart ?? inp.value.length;
  inp.value = inp.value.slice(0, it.from) + it.ins + inp.value.slice(pos);
  const c = it.from + it.ins.length; inp.setSelectionRange(c, c); inp.focus(); hideSuggest(); inp.dispatchEvent(new Event('input'));
}
function updateSuggest(){
  const inp = $('msgIn'); if (inp.disabled) return hideSuggest();
  const pos = inp.selectionStart ?? inp.value.length, before = inp.value.slice(0, pos);
  const fm = before.match(/^\/(\w*)$/);
  if (fm) { const q = fm[1].toLowerCase();
    return showSuggest([...FX_PUB, ...(adm() ? FX_ADM : [])].filter(n => n.startsWith(q)).map(n => ({label:'✨ /' + n + (FX_ADM.includes(n) ? ' (admin)' : ''), from:0, ins:'/' + n + ' '}))); }
  const mm = chat.kind === 'group' && before.match(/(?:^|\s)@(\w*)$/);
  if (mm) { const q = mm[1].toLowerCase(), from = before.length - mm[1].length - 1;
    return showSuggest([...new Set([...Object.keys(NAMES), ...profiles])].filter(u => u !== me && (u.startsWith(q) || nm(u).toLowerCase().startsWith(q))).slice(0, 6).map(u => ({label:nm(u) + ' @' + u, from, ins:'@' + u + ' '}))); }
  hideSuggest();
}
$('msgIn').addEventListener('input', () => {
  if (!editing && chat && canSendIn(chat.kind, chat.id)) { const v = $('msgIn').value, k = draftKey(readId()); if (v) localStorage.setItem(k, v); else localStorage.removeItem(k); }
  updateSuggest();
});
$('msgIn').addEventListener('blur', () => setTimeout(hideSuggest, 150));
$('msgIn').onkeydown = e => {
  if (sugItems.length) {
    if (e.key === 'ArrowDown' || e.key === 'ArrowUp') { e.preventDefault(); sugIdx = (sugIdx + (e.key === 'ArrowDown' ? 1 : sugItems.length - 1)) % sugItems.length; [...$('suggest').children].forEach((c, i) => c.classList.toggle('on', i === sugIdx)); return; }
    if (e.key === 'Tab' || e.key === 'Enter') { e.preventDefault(); pickSuggest(sugIdx); return; }
    if (e.key === 'Escape') { hideSuggest(); return; }
  }
  if (e.key === 'Enter') send();
};

/* text with clickable links + @mentions */
function fmtText(t){
  return String(t).split(/(https?:\/\/[^\s<>"']*[^\s<>"'.,!?)])/g).map((seg, i) => i % 2
    ? '<a href="' + esc(seg) + '" target="_blank" rel="noopener noreferrer">' + esc(seg) + '</a>'
    : esc(seg).replace(/@(\w+)/g, (_, n) => `<span class="mention${n.toLowerCase()===me?' me':''}">@${n}</span>`)).join('');
}
function dayLabel(dt){
  const now = new Date(), y = new Date(Date.now() - 864e5);
  if (dt.toDateString() === now.toDateString()) return 'Today'; if (dt.toDateString() === y.toDateString()) return 'Yesterday';
  return dt.toLocaleDateString([], {weekday:'short', day:'numeric', month:'short', ...(dt.getFullYear() !== now.getFullYear() ? {year:'numeric'} : {})});
}
const msgDeleted = id => { const d = lastDocs.find(x => x.id === id); return !!(d && d.data().deleted); };

  else setDoc(ref, {ck:readId(), cl:chat.label, name:m.name || m.from, text:String(m.text).slice(0, 300), at:Date.now()}).catch(e => toast('Save failed: ' + e.code));

$('starsBtn').onclick = () => { openModal('Saved messages', 'stars'); renderStars(); };

/* unsend: the bubble becomes "message deleted"; the original goes to an admin-only archive */
async function unsend(d, m){
  if (!confirm('Unsend this message?')) return;
  const b = writeBatch(db);
  b.set(doc(db,'unsent', d.id + '__' + me), {from:me, chat:readId(), text:String(m.text), at:serverTimestamp()});
  b.update(d.ref, {text:'', deleted:true, history:deleteField(), fx:deleteField()});
  try { await b.commit(); } catch (e) { toast(e.code === 'permission-denied' ? 'Unsend failed: the 15-minute time is over' : 'Unsend failed: ' + e.code); }
}
async function showOriginal(d, m){
  const b = openModal('Original (unsent) message', 'orig'); b.append(h('p', {class:'hint', text:'Loading…'}));
  try {
    const s = await getDoc(doc(db,'unsent', d.id + '__' + m.from)); if (modalKind !== 'orig') return; b.innerHTML = '';
    if (!s.exists()) b.append(h('p', {class:'hint', text:'No saved copy exists for this message.'}));
    else { const x = s.data(); b.append(h('div', {class:'hrow'}, h('b', {text:nm(x.from) + ' · unsent ' + (x.at ? x.at.toDate().toLocaleString() : '')}), h('div', {text:x.text}))); logAudit('view-unsent', nm(x.from)); }
  } catch (e) { b.innerHTML = ''; b.append(h('p', {class:'hint', text:'Could not load: ' + e.code})); }
}

/* composer: lock / mute / slow mode (admin ON is never blocked) */
const PH = 'Message… use @username to notify someone';
function composerState(){
  if (!canSendIn(chat.kind, chat.id)) return {ok:false, msg:'Read-only (admin monitor)'};
  if (adm()) return {ok:true};
  if (settings.locked) return {ok:false, msg:'🔒 Chat is locked by admin'};
  const mu = tms((settings.mutes || {})[me]);
  if (mu > Date.now()) return {ok:false, msg:'🔇 You are muted until ' + new Date(mu).toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'})};
  const n = settings.slow | 0;
  if (n > 0) {
    let last = 0;
    for (let i = lastDocs.length - 1; i >= 0; i--) { const m = lastDocs[i].data(); if (m.from === me) { last = m.ts ? tms(m.ts) : Date.now(); break; } }
    const wait = Math.ceil((last + n * 1000 - Date.now()) / 1000);
    if (last && wait > 0) return {ok:true, soft:true, wait, msg:'Slow mode: wait ' + wait + 's'};
  }
  return {ok:true};
}
function updateComposer(){
  const c = composerState(), inp = $('msgIn'), btn = $('sendBtn');
  inp.disabled = !c.ok; btn.disabled = !c.ok || !!c.soft;
  inp.placeholder = c.ok ? PH : c.msg; btn.textContent = c.soft ? c.wait + 's' : 'Send';
}
setInterval(() => { if (me && auth.currentUser) { updateComposer(); updateTyping(); } }, 1000);

/* ---------- voice calls (WebRTC, signaling through Firestore) ---------- */
let pc = null, localStream = null, callRef = null, callUnsubs = [], pendingICE = [], callRole = '', callPeer = '';
let callStart = 0, callTimer = null, callTimeout = null, incomingOffer = null, ac = null, ringT = null, titleT = null, iceCache = null, iceAt = 0;
const fmt = s => Math.floor(s/60) + ':' + String(s % 60).padStart(2,'0');

async function getIce(){
  if (iceCache && Date.now() - iceAt < 1800000) return iceCache;
  let list = [{urls:'stun:stun.l.google.com:19302'}, {urls:'stun:stun1.l.google.com:19302'}];
  if (WORKER_URL && auth.currentUser) {
    try {
      const idToken = await auth.currentUser.getIdToken(), ctl = new AbortController(), t = setTimeout(() => ctl.abort(), 3000);
      const r = await fetch(WORKER_URL, {method:'POST', signal:ctl.signal, headers:{'Content-Type':'application/json'}, body:JSON.stringify({idToken, action:'turn'})});
      clearTimeout(t);
      const turn = r.ok ? await r.json() : [];
      if (Array.isArray(turn) && turn.length) list = list.concat(turn);
    } catch {}
  }
  iceCache = list; iceAt = Date.now(); return list;
}
function ring(kind){
  stopRing();
  try {
    ac = ac || new (window.AudioContext || window.webkitAudioContext)(); ac.resume();
    const beep = () => { const o = ac.createOscillator(), g = ac.createGain(), t = ac.currentTime;
      o.frequency.value = kind === 'in' ? 880 : 440; o.connect(g); g.connect(ac.destination);
      g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.25, t + 0.03); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.7);
      o.start(t); o.stop(t + 0.8); if (kind === 'in' && navigator.vibrate) navigator.vibrate([300,150,300]); };
    beep(); ringT = setInterval(beep, kind === 'in' ? 1600 : 3000);
  } catch {}
}
function stopRing(){ clearInterval(ringT); ringT = null; try { navigator.vibrate && navigator.vibrate(0); } catch {} }
function flashTitle(on, who){
  clearInterval(titleT); document.title = 'NEON CHAT';
  if (on) { let f = 0; titleT = setInterval(() => { document.title = (f ^= 1) ? '📞 ' + who + ' calling…' : 'NEON CHAT'; }, 800); }
}
function showCallUI(peer, status, incoming){
  $('callName').textContent = nm(peer); $('callAvatar').textContent = nm(peer).charAt(0).toUpperCase();
  $('callStatus').textContent = status; $('callUI').style.display = 'flex';
  $('acceptBtn').style.display = incoming ? 'flex' : 'none';
  $('muteBtn').style.display = incoming ? 'none' : 'flex'; $('muteBtn').textContent = 'Mute';
  $('hangBtn').textContent = incoming ? 'Decline' : 'Hang up';
}
async function setupPC(){
  const iceServers = await getIce();
  localStream = await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true, noiseSuppression:true}});
  pc = new RTCPeerConnection({iceServers}); pendingICE = [];
  localStream.getTracks().forEach(t => pc.addTrack(t, localStream));
  pc.ontrack = e => { $('remoteA').srcObject = e.streams[0]; };
  pc.onicecandidate = e => { if (e.candidate && callRef)
    addDoc(collection(callRef, callRole === 'caller' ? 'callerCandidates' : 'calleeCandidates'), e.candidate.toJSON()).catch(() => {}); };
  pc.onconnectionstatechange = () => {
    const s = pc && pc.connectionState;
    if (s === 'connected') { stopRing(); if (!callStart) { callStart = Date.now(); callTimer = setInterval(tick, 1000); tick(); } }
    if (s === 'failed') { toast('Call could not connect'); endCall(true); }
  };
}
function tick(){ $('callStatus').textContent = fmt(Math.floor((Date.now() - callStart) / 1000)); }
async function addCandidate(c){ if (pc && pc.remoteDescription) await pc.addIceCandidate(c).catch(() => {}); else pendingICE.push(c); }
async function flushICE(){ const l = pendingICE; pendingICE = []; for (const c of l) await pc.addIceCandidate(c).catch(() => {}); }
function watchCandidates(sub){
  callUnsubs.push(onSnapshot(collection(callRef, sub), s => s.docChanges().forEach(c => { if (c.type === 'added') addCandidate(c.doc.data()); })));
}
function watchCallState(){
  const ref = callRef;
  callUnsubs.push(onSnapshot(ref, async s => {
    const d = s.data(); if (!d || callRef !== ref) return;
    if (callRole === 'caller' && d.answer && pc && !pc.remoteDescription) {
      try { await pc.setRemoteDescription(d.answer); flushICE(); stopRing(); $('callStatus').textContent = 'Connecting…'; } catch {}
    }
    if (d.status === 'ended' || d.status === 'declined') { if (d.status === 'declined') toast(nm(callPeer) + ' declined'); endCall(false); }
  }));
}

async function startCall(){
  if (pc || callRef || chat.kind !== 'dm' || !chat.id.split('__').includes(me)) return;
  const dmId = chat.id, ref = doc(collection(db, 'calls'));
  callPeer = dmId.split('__').find(x => x !== me); callRole = 'caller'; callRef = ref;
  showCallUI(callPeer, 'Calling…', false); ring('out');
  try { await setupPC(); } catch { toast('Allow the microphone to make calls'); return endCall(false, false); }
  if (callRef !== ref) return;
  const offer = await pc.createOffer();
  await setDoc(ref, {from:me, to:callPeer, status:'ringing', ts:serverTimestamp(), offer:{type:offer.type, sdp:offer.sdp}});  // before candidates start
  if (callRef !== ref) return;
  await pc.setLocalDescription(offer);
  pingWorker({kind:'call', id:dmId}, '');
  watchCandidates('calleeCandidates'); watchCallState();
  callTimeout = setTimeout(() => { if (callRef === ref && !callStart) { toast('No answer'); endCall(true); } }, 45000);
}

function showIncoming(snap){
  const d = snap.data();
  if (d.ts && Date.now() - d.ts.toMillis() > 45000) return;                    // stale
  if (callRef) { updateDoc(snap.ref, {status:'declined'}).catch(() => {}); return; }   // already busy
  callRef = snap.ref; callRole = 'callee'; callPeer = d.from; incomingOffer = d.offer;
  showCallUI(d.from, 'Incoming voice call…', true); ring('in'); flashTitle(true, nm(d.from)); watchCallState();
  if (document.hidden && typeof Notification !== 'undefined' && Notification.permission === 'granted' && !(WORKER_URL && localStorage.getItem('fcmToken')))
    navigator.serviceWorker?.getRegistration().then(r => r && r.showNotification('📞 ' + nm(d.from) + ' is calling', {body:'Incoming voice call', tag:'call' + snap.id, requireInteraction:true})).catch(() => {});
  const ref = snap.ref; callTimeout = setTimeout(() => { if (callRef === ref && !pc) endCall(false, false); }, 45000);
}
async function acceptCall(){
  const ref = callRef; stopRing(); flashTitle(false); clearTimeout(callTimeout);
  showCallUI(callPeer, 'Connecting…', false); $('hangBtn').textContent = 'Hang up';
  try { await setupPC(); } catch { toast('Allow the microphone to answer calls'); updateDoc(ref, {status:'declined'}).catch(() => {}); return endCall(false, false); }
  if (callRef !== ref || !pc) return;
  await pc.setRemoteDescription(incomingOffer); flushICE();
  const ans = await pc.createAnswer(); await pc.setLocalDescription(ans);
  await updateDoc(ref, {answer:{type:ans.type, sdp:ans.sdp}, status:'active'});
  watchCandidates('callerCandidates');
}

async function endCall(notify = true, log = true){
  const ref = callRef, role = callRole, peer = callPeer, dur = callStart ? Math.round((Date.now() - callStart) / 1000) : 0;
  callRef = null; callRole = ''; callPeer = ''; callStart = 0; incomingOffer = null;
  clearInterval(callTimer); clearTimeout(callTimeout); stopRing(); flashTitle(false);
  callUnsubs.forEach(f => f()); callUnsubs = [];
  if (localStream) localStream.getTracks().forEach(t => t.stop()); localStream = null;
  if (pc) { pc.onconnectionstatechange = null; pc.close(); pc = null; }
  $('remoteA').srcObject = null; $('callUI').style.display = 'none';
  if (ref && notify) updateDoc(ref, {status:'ended'}).catch(() => {});
  if (ref && log && role === 'caller' && auth.currentUser)      // the caller writes one history line per call
    addDoc(collection(db, 'dms', [me, peer].sort().join('__'), 'messages'),
      {from:me, name:nm(me), text: dur ? '📞 Voice call · ' + fmt(dur) : '📞 Missed call', ts:serverTimestamp()}).catch(() => {});
}
$('callBtn').onclick = startCall;
$('acceptBtn').onclick = acceptCall;
$('hangBtn').onclick = () => {
  if (callRole === 'callee' && !pc) { updateDoc(callRef, {status:'declined'}).catch(() => {}); endCall(false, false); } else endCall(true);
};
$('muteBtn').onclick = () => { const t = localStream && localStream.getAudioTracks()[0]; if (t) { t.enabled = !t.enabled; $('muteBtn').textContent = t.enabled ? 'Mute' : 'Unmute'; } };

/* ---------- notifications ---------- */
let messaging = null;
try { messaging = getMessaging(app); } catch {}
async function registerPush(){
  const reg = await navigator.serviceWorker.register('./firebase-messaging-sw.js');
  const token = await getToken(messaging, {vapidKey:VAPID_KEY, serviceWorkerRegistration:reg});
  await setDoc(doc(db,'tokens',me), {tokens:arrayUnion(token)}, {merge:true});
  localStorage.setItem('fcmToken', token);
}
async function autoNotif(){
  if (typeof Notification !== 'undefined' && Notification.permission === 'granted') {
    $('notifBtn').textContent = 'Alerts on ✓';
    if (messaging) registerPush().catch(() => {});
  }
}
$('notifBtn').onclick = async () => {
  if (typeof Notification === 'undefined') return toast('Notifications are not supported in this browser');
  if (await Notification.requestPermission() !== 'granted') return toast('Notifications were blocked');
  $('notifBtn').textContent = 'Alerts on ✓'; toast('Alerts enabled on this device');
  if (messaging) { try { await registerPush(); } catch (e) { console.warn('push token failed', e); } }
};
</script>
</body>
